# Guarded, exact-source data Worker version only. No R2 publication or route changes.
name: WeatherX production Wind100 point reader release
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RELEASE-PRODUCTION-WIND100-POINT-READER
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: weatherx-production-data-edge
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://weatherx.org
    env:
      ATMOS_SHA: f5dc141ef83f209a4cb7637447f87e1b43da7450
      ATMOS_ROOT: ${{ github.workspace }}/atmos
    steps:
      - name: Require exact release confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = RELEASE-PRODUCTION-WIND100-POINT-READER
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: cycle
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: f5dc141ef83f209a4cb7637447f87e1b43da7450
          fetch-depth: 0
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
          persist-credentials: false
      - name: Verify exact merged source and clean release checkouts
        run: |
          test "$(git -C cycle rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C atmos rev-parse HEAD)" = "$ATMOS_SHA"
          git -C atmos merge-base --is-ancestor "$ATMOS_SHA" refs/remotes/origin/master
          git -C cycle diff --exit-code HEAD
          git -C atmos diff --exit-code HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atmos/platform/edge/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install exact Python test dependencies
        run: python3 -m pip install pillow==12.2.0 numpy==2.4.6 eccodes==2.47.0 requests==2.34.2
      - name: Install locked Worker dependencies
        working-directory: atmos/platform/edge
        run: npm ci --ignore-scripts
      - name: Run complete Worker checks and point reader controller tests
        working-directory: atmos/platform/edge
        run: |
          node --test "$GITHUB_WORKSPACE/cycle/tests/production-wind100-point-reader-release.mjs"
          npm run check
          npx wrangler deploy --dry-run --config wrangler.data.jsonc --env production-serve
      - name: Upload one inactive version, activate, and verify live point data
        id: release_worker
        env:
          DATA_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_DATA_EDGE_API_TOKEN }}
          RECEIPT: ${{ runner.temp }}/wind100-point-reader/receipt.json
        run: node cycle/tools/production-wind100-point-reader-release.mjs release
      - name: Restore only this run's data Worker version on failure
        if: ${{ always() && (steps.release_worker.outcome == 'failure' || steps.release_worker.outcome == 'cancelled') }}
        env:
          DATA_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_DATA_EDGE_API_TOKEN }}
          RECEIPT: ${{ runner.temp }}/wind100-point-reader/receipt.json
        run: node cycle/tools/production-wind100-point-reader-release.mjs recover
      - name: Retain non-secret release and rollback receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-wind100-point-reader-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wind100-point-reader/receipt.json
          if-no-files-found: ignore
          retention-days: 30
