name: WeatherX bake throughput qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weatherx-bake-throughput-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment:
      name: atmos-source-read-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATMOS_SHA: 0335a3b0a85b629c8659032a032bbc5ea0911eff
    steps:
      - name: require the isolated read-only source key
        env:
          SOURCE_KEY_PROVISIONED: ${{ secrets.ATMOS_READONLY_KEY != '' }}
        run: test "$SOURCE_KEY_PROVISIONED" = true || { echo 'isolated Atmos source key is not provisioned'; exit 1; }
      - name: checkout exact qualification controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: cycle
          persist-credentials: false
      - name: checkout reviewed production-source candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: 0335a3b0a85b629c8659032a032bbc5ea0911eff
          ssh-key: ${{ secrets.ATMOS_READONLY_KEY }}
          fetch-depth: 1
          persist-credentials: false
          path: atmos
      - name: verify immutable controller and source identities
        run: |
          test "$(git -C cycle rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C atmos rev-parse HEAD)" = "$ATMOS_SHA"
          git -C cycle diff --exit-code HEAD
          git -C atmos diff --exit-code HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: install only frame-writer import dependencies
        run: python -m pip install numpy==2.4.6 pillow==12.2.0 requests==2.34.2 zarr==3.2.1
      - name: qualify full unattended GFS memory, bytes and throughput without providers or publication
        run: |
          status=0
          python cycle/tools/qualify-bake-throughput.py \
            --atmos-root atmos --source-sha "$ATMOS_SHA" \
            --receipt "$RUNNER_TEMP/bake-throughput-qualification.json" || status=$?
          cat "$RUNNER_TEMP/bake-throughput-qualification.json" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
