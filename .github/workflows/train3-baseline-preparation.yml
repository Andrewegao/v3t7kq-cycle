name: WeatherX Train 3 baseline preparation
on:
  workflow_dispatch:
    inputs:
      enable_preparation:
        description: Explicit owner approval for this bounded read and artifact retention
        type: boolean
        default: false
      operation:
        type: choice
        options: [metadata, inventory, batch-export]
        default: inventory
      reviewed_source_sha:
        description: Reviewed exact Cycle main commit containing this workflow
        type: string
        required: true
      expected_catalog_id:
        description: Reviewed current catalog identity; rotation fails closed
        type: string
        required: true
      reviewed_plan_sha256:
        description: Export or batch-export; exact tracked ops/train3-baseline/export-plan.json digest
        type: string
        default: ''
      reviewed_batch_plan_sha256:
        description: Batch-export only; exact tracked ops/train3-baseline/batch-plan.json digest
        type: string
        default: ''
      batch_id:
        description: Batch-export only; separately approved fixed selection
        type: choice
        options: ['', batch-1, batch-2, batch-3]
        default: ''
      owner_recipient_confirmed:
        description: Separate approval of private payload transfer and this exact recipient/destination
        type: boolean
        default: false
      reviewed_recipient_id:
        description: Batch-export only; approved recipient identity
        type: string
        default: ''
      reviewed_age_recipient:
        description: Batch-export only; approved native X25519 age public recipient (never a private key)
        type: string
        default: ''
      reviewed_age_recipient_sha256:
        description: Batch-export only; SHA256 of exact public recipient text without a newline
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: weatherx-train3-baseline-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ inputs.enable_preparation && github.ref == 'refs/heads/main' && inputs.reviewed_source_sha == github.sha }}
    environment:
      name: data-staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.21.1' }
      - name: Install existing locked S3 client without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix staging-controller
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/inventory
      - name: Prepare the exact public age toolchain without credentials
        run: node tools/train3-baseline-encrypt.mjs prepare-toolchain --destination "$RUNNER_TEMP/train3-age-tools"
      - name: Check acquisition contracts without credentials
        env:
          TRAIN3_AGE_BINARY: ${{ runner.temp }}/train3-age-tools/age
          TRAIN3_AGE_KEYGEN_BINARY: ${{ runner.temp }}/train3-age-tools/age-keygen
          TRAIN3_AGE_DISTRIBUTION_ARCHIVE: ${{ runner.temp }}/train3-age-tools/distribution.tar.gz
        run: node --test tests/train3-baseline-preparation.mjs tests/train3-baseline-join.mjs tests/train3-baseline-encrypt.mjs tests/train3-baseline-decrypt.mjs
      - name: Read the exact baseline through the existing shared reader
        env:
          TRAIN3_PREPARATION_ENABLED: ${{ inputs.enable_preparation }}
          PREPARATION_OPERATION: ${{ inputs.operation }}
          REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
          EXPECTED_CATALOG_ID: ${{ inputs.expected_catalog_id }}
          REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
          REVIEWED_BATCH_PLAN_SHA256: ${{ inputs.reviewed_batch_plan_sha256 }}
          BATCH_ID: ${{ inputs.batch_id }}
          OWNER_RECIPIENT_CONFIRMED: ${{ inputs.owner_recipient_confirmed }}
          RECIPIENT_ID: ${{ inputs.reviewed_recipient_id }}
          REVIEWED_RECIPIENT_ID: ${{ inputs.reviewed_recipient_id }}
          AGE_RECIPIENT: ${{ inputs.reviewed_age_recipient }}
          REVIEWED_AGE_RECIPIENT: ${{ inputs.reviewed_age_recipient }}
          REVIEWED_AGE_RECIPIENT_SHA256: ${{ inputs.reviewed_age_recipient_sha256 }}
          TRAIN3_AGE_BINARY: ${{ runner.temp }}/train3-age-tools/age
          TRAIN3_AGE_KEYGEN_BINARY: ${{ runner.temp }}/train3-age-tools/age-keygen
          TRAIN3_AGE_DISTRIBUTION_ARCHIVE: ${{ runner.temp }}/train3-age-tools/distribution.tar.gz
          SHARED_R2_READ_ACCESS_KEY_ID: ${{ secrets.SHARED_R2_READ_ACCESS_KEY_ID }}
          SHARED_R2_READ_SECRET_ACCESS_KEY: ${{ secrets.SHARED_R2_READ_SECRET_ACCESS_KEY }}
        run: node tools/train3-baseline-preparation.mjs
      - name: Retain only complete metadata or recipient-encrypted payload output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: train3-baseline-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/train3-baseline-preparation/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove only this invocation's private output
        if: ${{ always() }}
        run: |
          rm -rf -- "$RUNNER_TEMP/train3-baseline-work-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$RUNNER_TEMP/train3-baseline-preparation"
          rm -rf -- "$RUNNER_TEMP/train3-age-tools"
