name: WeatherX Train 3 baseline preparation
on:
  workflow_dispatch:
    inputs:
      enable_preparation:
        description: Explicit owner approval for this bounded read and artifact retention
        type: boolean
        default: false
      operation:
        type: choice
        options: [inventory, export]
        default: inventory
      reviewed_source_sha:
        description: Reviewed exact Cycle main commit containing this workflow
        type: string
        required: true
      expected_catalog_id:
        description: Reviewed current catalog identity; rotation fails closed
        type: string
        required: true
      reviewed_plan_sha256:
        description: Export only; exact tracked ops/train3-baseline/export-plan.json digest
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: weatherx-train3-baseline-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ inputs.enable_preparation && github.ref == 'refs/heads/main' && inputs.reviewed_source_sha == github.sha }}
    environment: data-staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.21.1' }
      - name: Install existing locked S3 client without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix staging-controller
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/inventory
      - name: Check acquisition contracts without credentials
        run: node --test tests/train3-baseline-preparation.mjs
      - name: Read the exact baseline through the existing shared reader
        env:
          TRAIN3_PREPARATION_ENABLED: ${{ inputs.enable_preparation }}
          PREPARATION_OPERATION: ${{ inputs.operation }}
          REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
          EXPECTED_CATALOG_ID: ${{ inputs.expected_catalog_id }}
          REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
          SHARED_R2_READ_ACCESS_KEY_ID: ${{ secrets.SHARED_R2_READ_ACCESS_KEY_ID }}
          SHARED_R2_READ_SECRET_ACCESS_KEY: ${{ secrets.SHARED_R2_READ_SECRET_ACCESS_KEY }}
        run: node tools/train3-baseline-preparation.mjs
      - name: Retain only complete original bytes and non-secret receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: train3-baseline-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/train3-baseline-preparation/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove only this invocation's private output
        if: ${{ always() }}
        run: |
          rm -rf -- "$RUNNER_TEMP/train3-baseline-work-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$RUNNER_TEMP/train3-baseline-preparation"
