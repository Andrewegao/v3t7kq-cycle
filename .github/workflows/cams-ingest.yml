# Energy Desk own ingest, CAMS dust and aerosol optical depth (Kazakhstan energy edition, W6; owner
# ruling 2026-10-08: no aggregator dependencies). Reads the CAMS global atmospheric composition forecast
# (dust AOD 550 nm + total AOD 550 nm, hourly, 5 days, area 56/46/40/88) from the Copernicus ADS with the
# pinned Atmos producer (data/fetch_cams.py), reduces it to the five solar clusters, publishes the catalog
# component energy-cams (mount data-atmos/energy/cams/) through the unchanged Atmos publisher, and reads
# /data-atmos/energy/cams/current.json back.
#
# Stands aside (green, nothing published) until both owner actions exist: the ADS key secret and an
# Atmos pin that carries the producer. A failed run never touches the served component: the last good
# pointer keeps serving and the app labels it with its own run (24 h limit, then «missing»).
name: Energy CAMS dust ingest
run-name: "${{ github.event_name == 'schedule' && 'energy cams: scheduled fallback' || inputs.dry_run && 'energy cams: dry run on the synthetic fixture' || format('energy cams: dispatched ({0})', inputs.run || 'newest published run') }}"
permissions:
  contents: read
on:
  schedule:
    # Fallback only: the Cloudflare scheduler Worker dispatches this at 00:40, 10:40, 12:40 and 22:40 UTC.
    # The ADS publication time of the 00/12 UTC runs is 待考: each run is asked 10 h 40 min after its
    # init (10:40 for 00Z, 22:40 for 12Z) and again 2 h later. Duplicates are no-ops: a run already
    # served stops before any credential.
    - cron: '40 0,10,12,22 * * *'
  workflow_dispatch:
    inputs:
      run:
        description: CAMS run YYYYMMDDHH, HH 00 or 12 (blank = newest run at least 10 h old)
        type: string
        required: false
      dry_run:
        description: Run the producer on the synthetic fixture only; publishes nothing
        type: boolean
        required: false
        default: false
      caller:
        description: Leave empty. Set only by the Cloudflare scheduler Worker
        type: string
        required: false
concurrency:
  group: weatherx-energy-cams-production
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 90
    env:
      ATMOS_SHA: 81e061dae0a03cc39e014dc08586bbd144823108
      APPROVED_SHA: ${{ vars.CURRENT_RUN_COMPONENT_PUBLISH_ATMOS_SHA }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      HAS_KEY: ${{ (secrets.ADS_API_KEY != '' || secrets.CDS_API_KEY != '') && 'true' || 'false' }}
    steps:
      - name: Require main and the approved production source before credentials
        run: |
          test "$GITHUB_REPOSITORY" = Andrewegao/v3t7kq-cycle
          test "$GITHUB_REF" = refs/heads/main
          test "$APPROVED_SHA" = "$ATMOS_SHA"
          RUN="$(jq -r '.inputs.run // ""' "$GITHUB_EVENT_PATH")"
          if [ -z "$RUN" ]; then
            # Same rule as data/fetch_cams.py newest_run(): the newest 00/12 UTC init at least 10 h old.
            READY="$(date -u -d '-10 hours' +%Y%m%d%H)"
            RUN="${READY:0:8}$([ "${READY:8:2}" -lt 12 ] && echo 00 || echo 12)"
          fi
          printf '%s\n' "$RUN" | grep -Eqx '20[0-9]{2}[01][0-9][0-3][0-9](00|12)'
          echo "RUN_ID=$RUN" >> "$GITHUB_ENV"
          echo "RUN_INIT=${RUN:0:4}-${RUN:4:2}-${RUN:6:2}T${RUN:8:2}:00:00Z" >> "$GITHUB_ENV"
      - name: Checkout exact controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cycle
          persist-credentials: false
          sparse-checkout: |
            tools/energy-ingest.mjs
            tools/energy-ingest-requirements.txt
          sparse-checkout-cone-mode: false
      - name: Checkout pinned Atmos producers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: weatherx-hq/atmos
          ref: 81e061dae0a03cc39e014dc08586bbd144823108
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
          persist-credentials: false
          sparse-checkout: |
            data
            ops/platform
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Stand aside until the owner actions exist
        id: ready
        run: |
          test "$(git -C atmos rev-parse HEAD)" = "$ATMOS_SHA"
          if [ ! -f atmos/data/fetch_cams.py ]; then
            echo "::notice::The pinned Atmos source predates the own-ingest producer. Owner: merge the Atmos PR, then re-pin (node tools/atmos-source-pin.mjs --set <sha>). Nothing published."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$DRY_RUN" != true ] && [ "$HAS_KEY" != true ]; then
            echo "::notice::No ADS_API_KEY (or CDS_API_KEY) secret. Owner: create the ADS account, accept the CAMS licence for cams-global-atmospheric-composition-forecasts, add the secret. Nothing published."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$DRY_RUN" != true ]; then
            if node cycle/tools/energy-ingest.mjs served cams "$RUN_INIT" | grep -qx 'served=true'; then
              echo "::notice::CAMS run $RUN_ID is already served. Nothing to do."
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: ${{ steps.ready.outputs.go == 'true' }}
        with: {python-version: '3.12'}
      - name: Provision the locked data runtime, the pinned ADS client and rclone
        if: ${{ steps.ready.outputs.go == 'true' }}
        timeout-minutes: 10
        run: |
          git -C atmos diff --quiet HEAD
          python -m venv atmos/data/.venv
          atmos/data/.venv/bin/pip install --require-hashes --only-binary=:all: -r atmos/data/requirements.lock
          atmos/data/.venv/bin/pip install --require-hashes --only-binary=:all: --no-deps -r cycle/tools/energy-ingest-requirements.txt
          archive="$RUNNER_TEMP/rclone-v1.75.0-linux-amd64.zip"
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/rclone/rclone/releases/download/v1.75.0/rclone-v1.75.0-linux-amd64.zip --output "$archive"
          printf '%s  %s\n' aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa "$archive" | sha256sum --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/rclone-v1.75.0-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1 | grep -Fx 'rclone v1.75.0'
      - name: Dry run on the synthetic fixture (no network, no key)
        if: ${{ steps.ready.outputs.go == 'true' && env.DRY_RUN == 'true' }}
        run: atmos/data/.venv/bin/python atmos/data/fetch_cams.py --dry-run --run "$RUN_ID" --map-field --out "$RUNNER_TEMP/energy-cams"
      - name: Ingest CAMS dust and total AOD for the solar clusters from ADS
        if: ${{ steps.ready.outputs.go == 'true' && env.DRY_RUN != 'true' }}
        # ADS queues requests; one cropped request (121 hourly leads x 2 variables) is a few MB.
        timeout-minutes: 60
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          atmos/data/.venv/bin/python atmos/data/fetch_cams.py --run "$RUN_ID" --map-field --out "$RUNNER_TEMP/energy-cams"
          test -f "$RUNNER_TEMP/energy-cams/current.json"
          node cycle/tools/energy-ingest.mjs check-tree cams "$RUNNER_TEMP/energy-cams"
      - name: Publish one immutable component and promote it with compare-and-swap
        if: ${{ steps.ready.outputs.go == 'true' && env.DRY_RUN != 'true' }}
        timeout-minutes: 15
        env:
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
        run: node cycle/tools/energy-ingest.mjs publish cams "$RUNNER_TEMP/energy-cams" "$GITHUB_WORKSPACE/atmos"
      - name: Read the public pointer and dated file back
        if: ${{ steps.ready.outputs.go == 'true' && env.DRY_RUN != 'true' }}
        timeout-minutes: 5
        run: node cycle/tools/energy-ingest.mjs readback cams "$RUNNER_TEMP/energy-cams"
      - name: Keep the produced pointer and document
        if: ${{ always() && steps.ready.outputs.go == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: energy-cams-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/energy-cams
          if-no-files-found: ignore
          retention-days: 7
