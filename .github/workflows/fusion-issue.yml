name: WeatherX fusion issuance
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Record one station first, or the complete frozen network
        type: choice
        options: [canary, full]
        default: canary
        required: true
      confirmation:
        description: Enter RECORD FUSION EVIDENCE
        type: string
        required: true
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: weatherx-fusion-issuance
  cancel-in-progress: false
jobs:
  record:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.FUSION_ISSUANCE_ENABLED == 'true') }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENGINE_SHA: ${{ vars.FUSION_ENGINE_SHA }}
      FUSION_CALIBRATION_RUNTIME_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: cycle
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Require an explicit canary or complete-network run
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SCHEDULE_ENABLED: ${{ vars.FUSION_ISSUANCE_ENABLED }}
        run: |
          [[ "$ENGINE_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            test "$CONFIRMATION" = 'RECORD FUSION EVIDENCE'
            case "$SCOPE" in canary) stations=1 ;; full) stations=64 ;; *) exit 1 ;; esac
          else
            test "$SCHEDULE_ENABLED" = 'true'
            stations=64
          fi
          echo "EXPECTED_STATIONS=$stations" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: ${{ env.ENGINE_SHA }}
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
          persist-credentials: false
      - name: Verify exact clean engine and evidence policy
        run: |
          test "$(git -C atmos rev-parse HEAD)" = "$ENGINE_SHA"
          test -z "$(git -C atmos status --porcelain)"
          node --test cycle/tests/fusion-production-evidence.mjs
          npm ci --prefix atmos/app
          atmos/app/node_modules/.bin/tsx --test atmos/ops/fusion/test-collection-provenance.ts atmos/ops/fusion/test-signed-origin.ts
          atmos/app/node_modules/.bin/tsc -p atmos/ops/fusion/tsconfig.json --noEmit
      - name: Append prospective forecasts and independent observations
        id: collect
        working-directory: atmos
        env:
          FUSION_ISSUANCE_KEY: ${{ secrets.FUSION_ISSUANCE_KEY }}
        run: |
          app/node_modules/.bin/tsx ops/fusion/cli.ts collect --publish --max-stations "$EXPECTED_STATIONS" --out "$RUNNER_TEMP/fusion-production-evidence"
      - name: Require every requested station and direct observation receipt
        id: receipt
        run: node cycle/tools/fusion-production-evidence.mjs receipt "$RUNNER_TEMP/fusion-production-evidence"
      - name: Read back every immutable issued forecast byte for byte
        id: readback
        working-directory: atmos
        env:
          FUSION_ARCHIVE_READ_KEY: ${{ secrets.FUSION_ARCHIVE_READ_KEY }}
          FUSION_ISSUANCE_KEY: ${{ secrets.FUSION_ISSUANCE_KEY }}
        run: |
          manifest_args=()
          if [ "$EXPECTED_STATIONS" = 64 ]; then manifest_args+=(--publish-manifest); fi
          app/node_modules/.bin/tsx ops/fusion/cli.ts verify-readback --collection "$RUNNER_TEMP/fusion-production-evidence" --archive-origin https://weatherx.org --out "$RUNNER_TEMP/fusion-production-readback" "${manifest_args[@]}"
          if [ "$EXPECTED_STATIONS" = 64 ]; then
            test -f "$RUNNER_TEMP/fusion-production-readback/manifest-receipt.json"
            export MANIFEST_RECEIPT="$RUNNER_TEMP/fusion-production-readback/manifest-receipt.json"
          fi
          READBACK_RECEIPT="$RUNNER_TEMP/fusion-production-readback/readback-receipt.json" node ../cycle/tools/fusion-production-evidence.mjs readback "$RUNNER_TEMP/fusion-production-evidence"
      - name: Record a bounded issuance gap
        if: ${{ failure() || cancelled() }}
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
          READBACK_OUTCOME: ${{ steps.readback.outcome }}
        run: node cycle/tools/fusion-production-evidence.mjs gap "$RUNNER_TEMP/fusion-production-evidence"
      - name: Summarize the bounded result
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/fusion-production-evidence/run-status.json" ]; then
            node -e "const v=require(process.argv[1]); console.log('### Fusion evidence\n\n- Status: '+v.status+'\n- Stations: '+(v.stations ?? 'gap')+'\n- Read back: '+(v.readbackVerified ?? 'gap')+'\n- Calibration: disabled')" "$RUNNER_TEMP/fusion-production-evidence/run-status.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep only bounded receipts, never private forecast bodies
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fusion-production-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fusion-production-evidence/collection-receipt.json
            ${{ runner.temp }}/fusion-production-evidence/collection-status.json
            ${{ runner.temp }}/fusion-production-evidence/run-status.json
            ${{ runner.temp }}/fusion-production-readback/readback-receipt.json
            ${{ runner.temp }}/fusion-production-readback/manifest-receipt.json
          if-no-files-found: error
          retention-days: 90
