# Build once, qualify the actual staging site, retain only an encrypted immutable candidate.
name: WeatherX UI staging qualification
run-name: Staging ${{ inputs.atmos_sha }}
on:
  workflow_dispatch:
    inputs:
      atmos_sha:
        description: Exact 40-character current Atmos master SHA to qualify
        required: true
        type: string
      model_selection_sha256:
        description: default (omitted) qualifies the armed UI_AUTO_PROMOTE_PROFILE while UI_AUTO_PROMOTE_ENABLED is true, otherwise approved; approved/hash uses a pinned selection; production-account-billing-v1 selects the reviewed production account UI; production-account-ru-kk-beta-v1 adds the exact RU/KK public locale beta; production-account-ru-kk-wind100-onboarding-v2 adds native production Wind100 and onboarding with billing UI off; release-roster-core-v1 enables reviewed core expansion plus release roster; release-roster-core-br11-v1 adds separately approved staging-only static compression; release-roster-core-account-v1 preserves separately approved staging accounts with standard compression; none selects baseline
        required: false
        default: default
        type: string
permissions:
  contents: read
  actions: read
  issues: write # existing guarded rollback fuse
concurrency:
  group: weatherx-ui-staging
  cancel-in-progress: false
jobs:
  profile:
    # Resolve only the protected public-metadata approval. This job receives no
    # Pages, Worker, storage, candidate, production or deployment credential.
    permissions:
      contents: read
    environment:
      name: ui-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      model_selection_sha256: ${{ steps.selection.outputs.model_selection_sha256 }}
      wind100_enabled: ${{ steps.selection.outputs.wind100_enabled }}
      wind100_catalog_id: ${{ steps.selection.outputs.wind100_catalog_id }}
      wind100_run_id: ${{ steps.selection.outputs.wind100_run_id }}
      wind100_selection_sha256: ${{ steps.selection.outputs.wind100_selection_sha256 }}
      wind100_dynamic: ${{ steps.selection.outputs.wind100_dynamic }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Resolve an approved staging profile or explicit baseline opt-out
        id: selection
        env:
          REQUESTED_SELECTION: ${{ inputs.model_selection_sha256 }}
          UI_AUTO_PROMOTE_ENABLED: ${{ vars.UI_AUTO_PROMOTE_ENABLED }}
          UI_AUTO_PROMOTE_PROFILE: ${{ vars.UI_AUTO_PROMOTE_PROFILE }}
          APPROVED_SELECTION: ${{ vars.UI_STAGING_MODEL_SELECTION_APPROVED_SHA256 }}
          APPROVED_CORE_PROFILE: ${{ vars.UI_STAGING_CORE_PROFILE_APPROVED }}
          APPROVED_STATIC_COMPRESSION: ${{ vars.UI_STAGING_STATIC_COMPRESSION_APPROVED }}
          APPROVED_ACCOUNT_PROFILE: ${{ vars.UI_STAGING_ACCOUNT_PROFILE_APPROVED }}
          APPROVED_PRODUCTION_ACCOUNT_PROFILE: ${{ vars.UI_PRODUCTION_ACCOUNT_PROFILE_APPROVED }}
          APPROVED_PUBLIC_LOCALE_BETA: ${{ vars.UI_PUBLIC_LOCALE_BETA_PROFILE_APPROVED }}
          APPROVED_PUBLIC_COMBINED: ${{ vars.UI_PUBLIC_COMBINED_PROFILE_APPROVED }}
          STAGING_WIND100_UI_ENABLED: ${{ vars.STAGING_WIND100_UI_ENABLED }}
          STAGING_WIND100_UI_CATALOG_ID: ${{ vars.STAGING_WIND100_UI_CATALOG_ID }}
          STAGING_WIND100_UI_RUN_ID: ${{ vars.STAGING_WIND100_UI_RUN_ID }}
          STAGING_WIND100_UI_SELECTION_SHA256: ${{ vars.STAGING_WIND100_UI_SELECTION_SHA256 }}
          STAGING_WIND100_UI_DYNAMIC: ${{ vars.STAGING_WIND100_UI_DYNAMIC }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { profileFor, resolveDispatchSelection, resolveSelectionRequest, resolveWind100BuildPin } from './cycle/tools/ui-staging-models.mjs';
          const requested = resolveDispatchSelection(process.env.REQUESTED_SELECTION,process.env.UI_AUTO_PROMOTE_ENABLED,process.env.UI_AUTO_PROMOTE_PROFILE);
          console.log(`Staging selection request: ${process.env.REQUESTED_SELECTION} -> ${requested}`);
          const selection = resolveSelectionRequest(requested,process.env.APPROVED_SELECTION,process.env.APPROVED_CORE_PROFILE,process.env.APPROVED_STATIC_COMPRESSION,process.env.APPROVED_ACCOUNT_PROFILE,undefined,process.env.APPROVED_PRODUCTION_ACCOUNT_PROFILE,{approvedPublicLocaleBeta:process.env.APPROVED_PUBLIC_LOCALE_BETA,approvedPublicCombined:process.env.APPROVED_PUBLIC_COMBINED});
          // Wind100 approval belongs only to the staging account profile. Protected
          // environment variables may remain enabled while a production-account
          // candidate is built, so remove them before resolving that distinct profile.
          const windEnvironment = ['production-account-billing-v1', 'production-account-ru-kk-beta-v1', 'production-account-ru-kk-wind100-onboarding-v2'].includes(selection)
            ? {
                ...process.env,
                STAGING_WIND100_UI_ENABLED: '',
                STAGING_WIND100_UI_CATALOG_ID: '',
                STAGING_WIND100_UI_RUN_ID: '',
                STAGING_WIND100_UI_SELECTION_SHA256: '',
                STAGING_WIND100_UI_DYNAMIC: '',
              }
            : process.env;
          const pin = resolveWind100BuildPin(profileFor(selection), windEnvironment);
          appendFileSync(process.env.GITHUB_OUTPUT,
            `model_selection_sha256=${selection}\nwind100_enabled=${pin ? 'true' : ''}\nwind100_catalog_id=${pin?.catalogId ?? ''}\nwind100_run_id=${pin?.runId ?? ''}\nwind100_selection_sha256=${pin?.selectionSha256 ?? ''}\nwind100_dynamic=${pin?.dynamic === true ? 'true' : ''}\n`);
          NODE
  atmos-evidence:
    # Decision B evidence check. No candidate checkout and no candidate code ever runs here; this
    # is the only job that references the Atmos CI read token, so candidate jobs cannot reach it.
    needs: profile
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment:
      name: atmos-ci-evidence
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      path: ${{ steps.atmos_ci.outputs.path }}
      atmos_run_id: ${{ steps.atmos_ci.outputs.atmos_run_id }}
      atmos_run_attempt: ${{ steps.atmos_ci.outputs.atmos_run_attempt }}
    env:
      ATMOS_SHA: ${{ inputs.atmos_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: verify Atmos CI evidence for the exact source
        id: atmos_ci
        env:
          ATMOS_CI_READ_TOKEN: ${{ secrets.ATMOS_CI_READ_TOKEN }}
        run: node cycle/tools/ui-app-test-receipt.mjs evidence
  build:
    # Source-read key only. No publisher token, decryption or promotion-signing key.
    needs: profile
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment:
      name: atmos-source-read-ui
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UI_BUILDS_ENABLED: ${{ vars.UI_BUILDS_ENABLED }}
      UI_BUILD_PUBLIC_KEY: ${{ vars.UI_BUILD_PUBLIC_KEY }}
      ATMOS_SHA: ${{ inputs.atmos_sha }}
      MODEL_SELECTION_SHA256: ${{ needs.profile.outputs.model_selection_sha256 }}
      STAGING_WIND100_UI_ENABLED: ${{ needs.profile.outputs.wind100_enabled }}
      STAGING_WIND100_UI_CATALOG_ID: ${{ needs.profile.outputs.wind100_catalog_id }}
      STAGING_WIND100_UI_RUN_ID: ${{ needs.profile.outputs.wind100_run_id }}
      STAGING_WIND100_UI_SELECTION_SHA256: ${{ needs.profile.outputs.wind100_selection_sha256 }}
      STAGING_WIND100_UI_DYNAMIC: ${{ needs.profile.outputs.wind100_dynamic }}
      VITE_FUSION_CALIBRATION_ENABLED: ${{ vars.FUSION_CALIBRATION_RUNTIME_ENABLED == 'true' && '1' || '0' }}
      VITE_PLATFORM_ACCOUNT: '0'
      # This local onboarding/account prototype is admitted only by the exact
      # non-promotable staging-account profile. Every other selector compiles it out.
      VITE_PRO_PROTO: ${{ needs.profile.outputs.model_selection_sha256 == 'release-roster-core-account-v1' && '1' || '0' }}
      VITE_MODEL_EXPANSION_QUALIFICATION: '0'
      VITE_MODEL_LOCAL_BASE: ''
      VITE_STAGING_MODEL_ADMISSION: '0'
      VITE_STAGING_MODEL_SELECTION_SHA256: ''
      # The retained ground package is approved only for this staging qualification lane.
      # Production workflows never receive this scope.
      WX_GROUND_QUALIFICATION_SCOPE: staging-qualification-only
    steps:
      - name: require isolated source key without legacy fallback
        env:
          SOURCE_KEY_PROVISIONED: ${{ secrets.ATMOS_READONLY_KEY != '' }}
        run: |
          test "$SOURCE_KEY_PROVISIONED" = true || { echo 'isolated UI source key is not provisioned'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, fetch-depth: 0, persist-credentials: false }
      - name: checkout reviewed release controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          # Baseline artifacts keep the production-compatible controller; staging-only
          # profiles use a separately reviewed literal pin. Never accept an input SHA here.
          ref: ${{ needs.profile.outputs.model_selection_sha256 == 'production-account-ru-kk-wind100-onboarding-v2' && '34efee01d95942145c6dfc79732278728cef0ddf' || needs.profile.outputs.model_selection_sha256 == 'production-account-ru-kk-beta-v1' && 'b9db38dd22eed1da56c6c4dd4140480da7e89153' || needs.profile.outputs.model_selection_sha256 == 'production-account-billing-v1' && '6fcec22638f6696be71daa2f2e974ebc4b24318e' || needs.profile.outputs.model_selection_sha256 == 'none' && '25c402db5149daa018e349a34a4beeba1f2dca45' || '4dafd26387d5917604deb7379a8d45a994fc5b67' }}
          ssh-key: ${{ secrets.ATMOS_READONLY_KEY }}
          persist-credentials: false
          path: control
          # Only this literal controller/profile has a reviewed build-only closure.
          # Empty lines keep every other profile's existing full checkout.
          sparse-checkout: |
            ${{ needs.profile.outputs.model_selection_sha256 == 'production-account-ru-kk-wind100-onboarding-v2' && '/.gitignore' || '' }}
            ${{ needs.profile.outputs.model_selection_sha256 == 'production-account-ru-kk-wind100-onboarding-v2' && '/platform/edge/package.json' || '' }}
            ${{ needs.profile.outputs.model_selection_sha256 == 'production-account-ru-kk-wind100-onboarding-v2' && '/platform/edge/package-lock.json' || '' }}
            ${{ needs.profile.outputs.model_selection_sha256 == 'production-account-ru-kk-wind100-onboarding-v2' && '/ops/release/build-release-receipt.mjs' || '' }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: enforce manually enabled isolated build
        run: node cycle/tools/ui-release.mjs build-gate
      - name: check pinned receipt profile compatibility before build work
        if: ${{ needs.profile.outputs.model_selection_sha256 != 'none' }}
        run: node cycle/tools/ui-release-profile-preflight.mjs
      - name: preflight public staging data before expensive build or deployment
        env:
          UI_CYCLE_ROOT: cycle
        run: node cycle/tools/ui-staging-preflight.mjs
      - name: checkout exact candidate Atmos source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: ${{ inputs.atmos_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.ATMOS_READONLY_KEY }}
          persist-credentials: false
          path: atmos
      - name: verify current-master or reviewed combined UI ancestor source
        working-directory: atmos
        run: |
          [[ "$ATMOS_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ATMOS_SHA"
          if [ "$MODEL_SELECTION_SHA256" = production-account-ru-kk-wind100-onboarding-v2 ]; then
            node ../cycle/tools/ui-combined-source-guard.mjs . "$ATMOS_SHA"
          else
            test "$ATMOS_SHA" = "$(git rev-parse origin/master)"
          fi
      - name: verify combined-profile layer harness source before dependency install
        if: ${{ needs.profile.outputs.model_selection_sha256 == 'production-account-ru-kk-wind100-onboarding-v2' }}
        run: node cycle/tools/ui-release-layer-guard.mjs source "${{ github.workspace }}/atmos" "$ATMOS_SHA"
      # Candidate-domain npm tarball cache under its own key prefix: only build/app-tests ever
      # restore it (never setup-node's generic key shared with publisher workflows). Only the
      # integrity-checked _cacache store; npm ci verifies every tarball against the lockfile.
      - name: restore candidate-only npm download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm/_cacache
          key: ui-candidate-npm-${{ runner.os }}-${{ hashFiles('atmos/app/package-lock.json', 'control/platform/edge/package-lock.json') }}
          restore-keys: ui-candidate-npm-${{ runner.os }}-
      - name: install locked dependencies and browsers
        run: |
          python3.11 -m pip install pillow
          npm ci --prefix atmos/app
          npm ci --prefix control/platform/edge
          cd atmos/app && npx playwright install --with-deps chromium
      - name: verify independent release architecture
        working-directory: atmos
        run: |
          node ops/platform/test-independent-ui-release.mjs
          node ops/release/test-production-verifiers.mjs
      - name: Weather Lab release gate
        working-directory: atmos
        env:
          LIVE_DATA: '1'
        run: bash ops/weather-lab-ready.sh
      - name: build final public-only shell and Functions exactly once
        run: node cycle/tools/ui-release.mjs build
      - name: encrypt unqualified build for the isolated publisher (public key only)
        run: node cycle/tools/ui-release.mjs pack-build
      - name: retain encrypted build transport, never plaintext server code
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-build/build.wxub
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  app-tests:
    # Exact-source app test evidence overlaps the browser/build lane; no publisher credentials.
    # Only the candidate-domain npm download cache; never a publisher or browser cache.
    needs: [profile, atmos-evidence]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment:
      name: atmos-source-read-ui
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      receipt: ${{ steps.evidence.outputs.receipt }}
    env:
      UI_BUILDS_ENABLED: ${{ vars.UI_BUILDS_ENABLED }}
      ATMOS_SHA: ${{ inputs.atmos_sha }}
      MODEL_SELECTION_SHA256: ${{ needs.profile.outputs.model_selection_sha256 }}
      STAGING_WIND100_UI_ENABLED: ${{ needs.profile.outputs.wind100_enabled }}
      STAGING_WIND100_UI_CATALOG_ID: ${{ needs.profile.outputs.wind100_catalog_id }}
      STAGING_WIND100_UI_RUN_ID: ${{ needs.profile.outputs.wind100_run_id }}
      STAGING_WIND100_UI_SELECTION_SHA256: ${{ needs.profile.outputs.wind100_selection_sha256 }}
      STAGING_WIND100_UI_DYNAMIC: ${{ needs.profile.outputs.wind100_dynamic }}
      VITE_FUSION_CALIBRATION_ENABLED: ${{ vars.FUSION_CALIBRATION_RUNTIME_ENABLED == 'true' && '1' || '0' }}
      VITE_PLATFORM_ACCOUNT: '0'
      # This local onboarding/account prototype is admitted only by the exact
      # non-promotable staging-account profile. Every other selector compiles it out.
      VITE_PRO_PROTO: ${{ needs.profile.outputs.model_selection_sha256 == 'release-roster-core-account-v1' && '1' || '0' }}
      VITE_MODEL_EXPANSION_QUALIFICATION: '0'
      VITE_MODEL_LOCAL_BASE: ''
      VITE_STAGING_MODEL_ADMISSION: '0'
      VITE_STAGING_MODEL_SELECTION_SHA256: ''
      # The retained ground package is approved only for this staging qualification lane.
      # Production workflows never receive this scope.
      WX_GROUND_QUALIFICATION_SCOPE: staging-qualification-only
      WX_CI_PROFILE: ${{ (needs.profile.outputs.model_selection_sha256 == 'production-account-ru-kk-beta-v1' || needs.profile.outputs.model_selection_sha256 == 'production-account-ru-kk-wind100-onboarding-v2') && 'public-beta-ci-lab-road-security-v1' || '' }}
    steps:
      - name: require isolated source key without legacy fallback
        env:
          SOURCE_KEY_PROVISIONED: ${{ secrets.ATMOS_READONLY_KEY != '' }}
        run: |
          test "$SOURCE_KEY_PROVISIONED" = true || { echo 'isolated UI source key is not provisioned'; exit 1; }
          test "$UI_BUILDS_ENABLED" = true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, persist-credentials: false }
      - name: checkout exact app test source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: ${{ inputs.atmos_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.ATMOS_READONLY_KEY }}
          persist-credentials: false
          path: atmos
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: verify exact test source
        working-directory: atmos
        run: |
          [[ "$ATMOS_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ATMOS_SHA"
          if [ "$MODEL_SELECTION_SHA256" = production-account-ru-kk-wind100-onboarding-v2 ]; then
            node ../cycle/tools/ui-combined-source-guard.mjs . "$ATMOS_SHA"
          else
            test "$ATMOS_SHA" = "$(git rev-parse origin/master)"
          fi
      # Candidate-domain npm tarball cache under its own key prefix: only build/app-tests ever
      # restore it (never setup-node's generic key shared with publisher workflows). Only the
      # integrity-checked _cacache store; npm ci verifies every tarball against the lockfile.
      - name: restore candidate-only npm download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm/_cacache
          key: ui-candidate-npm-${{ runner.os }}-${{ hashFiles('atmos/app/package-lock.json', 'control/platform/edge/package-lock.json') }}
          restore-keys: ui-candidate-npm-${{ runner.os }}-
      - name: install locked app test dependencies and browsers
        run: |
          python3.11 -m pip install pillow
          npm ci --prefix atmos/app
          cd atmos/app && npx playwright install --with-deps chromium
      # atmos-ci path: Atmos already ran the complete suite for this exact SHA in its own CI
      # environment; keep a shorter gate that still executes the candidate in this trust domain.
      # Static gates follow the selection exactly like the full-local suite (job-level
      # WX_CI_PROFILE: public-beta for RU/KK, full otherwise), so the token never changes which
      # i18n gate runs. RU/KK first proves Atmos still tracks the manifest that justifies it.
      - name: local certification and visual gate
        if: ${{ needs.atmos-evidence.outputs.path == 'atmos-ci' }}
        run: |
          if [ -n "$WX_CI_PROFILE" ]; then git -C atmos ls-files --error-unmatch ops/release/public-beta-ci-manifest.json; fi
          npm run gates --prefix atmos/app
          npm run test:certify --prefix atmos/app
          cd atmos/app && npx playwright test
      # full-local path: unchanged complete suite (token absent or evidence not proven).
      - name: full application test gate
        if: ${{ needs.atmos-evidence.outputs.path == 'full-local' }}
        run: npm test --prefix atmos/app
      - name: bind successful app test evidence to this source and attempt
        id: evidence
        env:
          UI_APP_TEST_EVIDENCE_PATH: ${{ needs.atmos-evidence.outputs.path }}
          UI_APP_TEST_ATMOS_RUN_ID: ${{ needs.atmos-evidence.outputs.atmos_run_id }}
          UI_APP_TEST_ATMOS_RUN_ATTEMPT: ${{ needs.atmos-evidence.outputs.atmos_run_attempt }}
        run: node cycle/tools/ui-app-test-receipt.mjs emit
  qualify:
    needs: [profile, build, atmos-evidence, app-tests]
    # A fresh runner executes pinned controller code only, never candidate source.
    environment:
      name: ui-staging
      url: https://staging.weatherx.org
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UI_APP_TEST_RECEIPT: ${{ needs.app-tests.outputs.receipt }}
      # Straight from the evidence job, which never ran candidate code.
      UI_APP_TEST_EVIDENCE_PATH: ${{ needs.atmos-evidence.outputs.path }}
      UI_APP_TEST_ATMOS_RUN_ID: ${{ needs.atmos-evidence.outputs.atmos_run_id }}
      UI_APP_TEST_ATMOS_RUN_ATTEMPT: ${{ needs.atmos-evidence.outputs.atmos_run_attempt }}
      UI_RELEASES_ENABLED: ${{ vars.UI_RELEASES_ENABLED }}
      UI_ISOLATION_APPROVED: ${{ vars.UI_ISOLATION_APPROVED }}
      UI_DEPLOYMENT_HOLD_UNTIL: ${{ vars.UI_DEPLOYMENT_HOLD_UNTIL }}
      ATMOS_SHA: ${{ inputs.atmos_sha }}
      MODEL_SELECTION_SHA256: ${{ needs.profile.outputs.model_selection_sha256 }}
      UI_STAGING_MODEL_SELECTION_APPROVED_SHA256: ${{ vars.UI_STAGING_MODEL_SELECTION_APPROVED_SHA256 }}
      UI_STAGING_CORE_PROFILE_APPROVED: ${{ vars.UI_STAGING_CORE_PROFILE_APPROVED }}
      UI_STAGING_STATIC_COMPRESSION_APPROVED: ${{ vars.UI_STAGING_STATIC_COMPRESSION_APPROVED }}
      UI_STAGING_ACCOUNT_PROFILE_APPROVED: ${{ vars.UI_STAGING_ACCOUNT_PROFILE_APPROVED }}
      UI_PRODUCTION_ACCOUNT_PROFILE_APPROVED: ${{ vars.UI_PRODUCTION_ACCOUNT_PROFILE_APPROVED }}
      UI_PUBLIC_LOCALE_BETA_PROFILE_APPROVED: ${{ vars.UI_PUBLIC_LOCALE_BETA_PROFILE_APPROVED }}
      UI_PUBLIC_COMBINED_PROFILE_APPROVED: ${{ vars.UI_PUBLIC_COMBINED_PROFILE_APPROVED }}
      STAGING_WIND100_UI_ENABLED: ${{ needs.profile.outputs.wind100_enabled }}
      STAGING_WIND100_UI_CATALOG_ID: ${{ needs.profile.outputs.wind100_catalog_id }}
      STAGING_WIND100_UI_RUN_ID: ${{ needs.profile.outputs.wind100_run_id }}
      STAGING_WIND100_UI_SELECTION_SHA256: ${{ needs.profile.outputs.wind100_selection_sha256 }}
      STAGING_WIND100_UI_DYNAMIC: ${{ needs.profile.outputs.wind100_dynamic }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, fetch-depth: 0, persist-credentials: false }
      - name: checkout pinned controller, NOT candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: ${{ needs.profile.outputs.model_selection_sha256 == 'production-account-ru-kk-wind100-onboarding-v2' && '34efee01d95942145c6dfc79732278728cef0ddf' || needs.profile.outputs.model_selection_sha256 == 'production-account-ru-kk-beta-v1' && 'b9db38dd22eed1da56c6c4dd4140480da7e89153' || needs.profile.outputs.model_selection_sha256 == 'production-account-billing-v1' && '6fcec22638f6696be71daa2f2e974ebc4b24318e' || needs.profile.outputs.model_selection_sha256 == 'none' && '25c402db5149daa018e349a34a4beeba1f2dca45' || '4dafd26387d5917604deb7379a8d45a994fc5b67' }}
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          persist-credentials: false
          path: control
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: enforce manual activation and freeze
        run: node cycle/tools/ui-release.mjs gate
      # No cache crosses into this publisher runner. The two locked installs are independent,
      # so the Functions toolchain installs concurrently with the app/browser install.
      - name: install pinned controller and verification tools (no candidate scripts)
        run: |
          npm ci --prefix control/platform/edge >"$RUNNER_TEMP/npm-ci-edge.log" 2>&1 &
          edge=$!
          npm ci --prefix control/app
          (cd control/app && npx playwright install --with-deps chromium)
          if ! wait "$edge"; then cat "$RUNNER_TEMP/npm-ci-edge.log"; exit 1; fi
          cat "$RUNNER_TEMP/npm-ci-edge.log"
      - name: authenticate successful same-attempt build and restore opaque bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UI_BUILD_PRIVATE_KEY: ${{ secrets.UI_BUILD_PRIVATE_KEY }}
        run: node cycle/tools/ui-release.mjs receive-build
      - name: guarded staging deploy and real built-site qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.UI_STAGING_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.UI_STAGING_ACCOUNT_ID }}
          UI_PAGES_CONFIG_SHA256: ${{ vars.UI_PAGES_CONFIG_SHA256 }}
        run: node cycle/tools/ui-release.mjs deploy staging
      - name: seal qualified artifact (private server code is never uploaded in plaintext)
        env:
          UI_CANDIDATE_KEY: ${{ secrets.UI_CANDIDATE_KEY }}
        run: node cycle/tools/ui-release.mjs retain
      - name: retain encrypted candidate and public source/digest summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-sealed/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      # Public routing hint for automatic promotion: the same summary.json (source, run,
      # attempt, digest, release profile name). Promotion re-audits it against the sealed candidate.
      - name: retain public promotion routing summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-candidate-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-sealed/summary.json
          if-no-files-found: error
          retention-days: 90
      - name: retain automatic rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-staging-incidents-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ui-incidents/*.json
            ${{ runner.temp }}/ui-deploy-transactions/staging.json
            ${{ runner.temp }}/ui-deploy-transactions/staging-guard-success.json
            ${{ runner.temp }}/ui-public-release-journeys/staging.json
          if-no-files-found: ignore
          retention-days: 90
      - name: retain failed core browser receipt
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-staging-core-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-model-browser.json
          if-no-files-found: ignore
          retention-days: 90
