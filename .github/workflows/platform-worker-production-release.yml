# Pinned, exact-source production platform Worker release. Code only: no route, secret, cron,
# data, Pages, Stripe or purchase writes, and never the separate data Worker.
name: WeatherX production platform Worker release
run-name: "${{ format('Production platform Worker {0} {1}', inputs.mode, inputs.atmos_sha) }}"
on:
  workflow_dispatch:
    inputs:
      atmos_sha:
        description: Exact 40-character Atmos master SHA to release
        required: true
        type: string
      mode:
        description: plan is read-only; release replaces the planned active version
        required: true
        default: plan
        type: choice
        options: [plan, release]
      expected_active_version_id:
        description: Active Worker version reported by the plan run (release only)
        required: false
        type: string
      confirm:
        description: Exact PLAN-PRODUCTION-PLATFORM-WORKER:<sha> or RELEASE-PRODUCTION-PLATFORM-WORKER:<sha>
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: weatherx-production-data-edge
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.repository == 'Andrewegao/v3t7kq-cycle' }}
    environment:
      name: production
      url: https://weatherx.org
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ATMOS_SHA: ${{ inputs.atmos_sha }}
      ATMOS_ROOT: ${{ github.workspace }}/atmos
      RELEASE_MODE: ${{ inputs.mode }}
      EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
      CONFIRM: ${{ inputs.confirm }}
      RELEASE_DIR: ${{ runner.temp }}/platform-worker-release
      WORKER_RELEASE_ENVIRONMENT: production
    steps:
      - name: Require exact mode and source confirmation
        run: |
          [[ "$ATMOS_SHA" =~ ^[a-f0-9]{40}$ ]]
          case "$RELEASE_MODE" in
            plan) test "$CONFIRM" = "PLAN-PRODUCTION-PLATFORM-WORKER:$ATMOS_SHA"; test -z "$EXPECTED_ACTIVE_VERSION_ID" ;;
            release) test "$CONFIRM" = "RELEASE-PRODUCTION-PLATFORM-WORKER:$ATMOS_SHA"
              [[ "$EXPECTED_ACTIVE_VERSION_ID" =~ ^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$ ]] ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: cycle
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: ${{ inputs.atmos_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
          persist-credentials: false
      - name: Verify exact merged source and clean release checkouts
        run: |
          test "$(git -C cycle rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C atmos rev-parse HEAD)" = "$ATMOS_SHA"
          git -C atmos merge-base --is-ancestor "$ATMOS_SHA" refs/remotes/origin/master
          git -C cycle diff --exit-code HEAD
          git -C atmos diff --exit-code HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atmos/platform/edge/package-lock.json
      - name: Install locked Worker dependencies
        working-directory: atmos/platform/edge
        run: npm ci --ignore-scripts
      - name: Controller contracts
        run: node --test cycle/tests/platform-worker-production-release.mjs
      - name: Worker gate for the exact source (types, config, unit, runtime contracts, bundle)
        working-directory: atmos/platform/edge
        env:
          VITEST_MAX_WORKERS: "2"
        run: |
          npm run types
          npx tsc --noEmit
          node scripts/verify-config.mjs production
          npx vitest run --exclude 'test/commercial*' --exclude 'test/commercialApi/**'
          npm run test:source-health-runtime
          npm run test:gdacs-runtime
          npm run test:aircraft-runtime
          npm run test:forecast-fallback-runtime
          npx wrangler deploy --dry-run --env production --outdir "$RUNNER_TEMP/platform-worker-bundle"
          git -C "$ATMOS_ROOT" diff --exit-code HEAD
      - name: Record the production route boundary (read-only route token)
        id: routes_before
        env:
          DATA_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_DATA_EDGE_API_TOKEN }}
        run: node cycle/tools/platform-worker-production-release.mjs routes-before
      - name: Plan, or upload one inactive version, activate it and verify production
        id: release_worker
        env:
          PLATFORM_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: node cycle/tools/platform-worker-production-release.mjs "$RELEASE_MODE"
      - name: Restore only this run's predecessor if the release failed
        if: ${{ always() && inputs.mode == 'release' && (steps.release_worker.outcome == 'failure' || steps.release_worker.outcome == 'cancelled') }}
        env:
          PLATFORM_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: node cycle/tools/platform-worker-production-release.mjs recover
      - name: Prove the production route boundary is unchanged (read-only route token)
        if: ${{ always() && steps.routes_before.outcome == 'success' }}
        env:
          DATA_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_DATA_EDGE_API_TOKEN }}
        run: node cycle/tools/platform-worker-production-release.mjs routes-after
      - name: Retain non-secret plan, release and rollback receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-worker-production-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-worker-release/*.json
          if-no-files-found: ignore
          retention-days: 30
