# Refresh only the four point-observation catalogs, then publish through the existing immutable
# whole-release path. This job shares the legacy whole-maintenance writer lock and has no Pages,
# staging, vault, outbound workflow-dispatch, or application deployment authority.
name: observation-bake
permissions:
  contents: read
on:
  schedule:
    - cron: '10 2,8,14,20 * * *' # finish before the :30 full-maintenance publisher normally arrives
  workflow_dispatch:

jobs:
  observation-points:
    concurrency:
      group: weatherx-data-maintenance
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout exact CI-approved Atmos observation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: 14a2cda498ffb499cbd0fe2410d3818e364fe4d0
          path: atmos-source
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          fetch-depth: 1
          persist-credentials: false
      - name: verify exact immutable observation source
        working-directory: atmos-source
        env:
          ATMOS_SHA: 14a2cda498ffb499cbd0fe2410d3818e364fe4d0
        run: |
          test "$(git rev-parse HEAD)" = "$ATMOS_SHA"
          git diff --exit-code HEAD
      # The source pin is reviewable before its Atmos queue clears, but execution is not. A bounded
      # master witness makes an accidental early Cycle merge fail closed. A squash/rebase merge also
      # refuses until this workflow is deliberately repinned; never weaken this ancestry check.
      - name: checkout bounded Atmos master ancestry witness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: master
          path: atmos-master-witness
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          fetch-depth: 64
          persist-credentials: false
      - name: refuse an observation source absent from Atmos master
        env:
          ATMOS_SHA: 14a2cda498ffb499cbd0fe2410d3818e364fe4d0
        run: |
          git -C atmos-master-witness cat-file -e "$ATMOS_SHA^{commit}"
          git -C atmos-master-witness merge-base --is-ancestor "$ATMOS_SHA" HEAD
          test "$(git -C atmos-source rev-parse HEAD)" = "$ATMOS_SHA"
      - name: pinned observation runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: pinned release-manifest runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: pinned S3-compatible transfer client
        run: |
          archive="$RUNNER_TEMP/rclone-v1.75.0-linux-amd64.zip"
          curl --fail --silent --show-error --location \
            https://github.com/rclone/rclone/releases/download/v1.75.0/rclone-v1.75.0-linux-amd64.zip \
            --output "$archive"
          printf '%s  %s\n' 'aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa' "$archive" | sha256sum --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/rclone-v1.75.0-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1 | grep -Fx 'rclone v1.75.0'
      - name: install approved observation dependencies
        working-directory: atmos-source
        run: |
          python -m venv data/.venv
          data/.venv/bin/pip install -r data/requirements.txt
      - name: hydrate and verify current production whole release
        working-directory: atmos-source
        env:
          R2_REMOTE: weatherx:weatherx-data-production
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/platform/hydrate-r2-release.sh
      - name: refresh independent point observations without publication credentials
        working-directory: atmos-source
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          : "${OPENAQ_API_KEY:?production OPENAQ_API_KEY is required}"
          PYTHON="$PWD/data/.venv/bin/python" bash ops/bake-observation-points.sh
      - name: verify, upload, and conditionally promote one immutable whole release
        working-directory: atmos-source
        env:
          POINT_SERIES_REQUIRED: '1'
          R2_REMOTE: weatherx:weatherx-data-production
          RELEASE_ID: cycle-observations-${{ github.run_id }}-${{ github.run_attempt }}
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: |
          EXPECTED_CURRENT_RELEASE_ID="$(bash ops/platform/read-current-r2-release.sh)"
          export EXPECTED_CURRENT_RELEASE_ID
          bash ops/platform/publish-r2-release.sh
