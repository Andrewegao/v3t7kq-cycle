name: WeatherX scheduler CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bake.yml"
      - ".github/workflows/catalog-bake.yml"
      - ".github/workflows/scheduler-ci.yml"
      - ".github/workflows/scheduler-deploy.yml"
      - ".github/workflows/ui-release.yml"
      - ".github/workflows/ui-staging.yml"
      - ".github/workflows/staging-data.yml"
      - ".github/workflows/staging-consumer-refresh.yml"
      - ".github/workflows/staging-data-activate.yml"
      - ".github/workflows/verify-backfill.yml"
      - ".github/workflows/consumer-refresh.yml"
      - ".github/workflows/gdacs-feed-release.yml"
      - ".github/workflows/fusion-*.yml"
      - "scheduler/**"
      - "tests/**"
      - "tools/**"
      - "staging-controller/**"

permissions:
  contents: read

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scheduler/package-lock.json
      - run: npm ci --prefix scheduler
      - run: npm run check --prefix scheduler
      - name: Late-failure bake diagnostic retention contract
        run: |
          node tests/bake-diagnostics.mjs
          node --test tests/collector-source.mjs
      - name: Staged UI artifact, manual promotion and privacy contracts
        run: node --test tests/ui-*.mjs
      - name: Cloud-only staging data isolation and public-mode contracts
        run: node --test tests/staging-data.mjs tests/shared-data.mjs
      - name: Staging activation transport and fail-closed recovery contracts
        run: |
          npm ci --ignore-scripts --prefix staging-controller
          node --test tests/staging-*.mjs
      - name: Consumer refresh workflow safety contract
        run: |
          node tests/consumer-workflow.mjs
          node --test tests/scheduler-deploy-plan.mjs
      - name: Consumer refresh preflight and rollback contracts
        run: node --test tests/consumer-refresh*.mjs
      - name: GDACS isolated route workflow and recovery contracts
        run: |
          node tests/gdacs-feed-workflow.mjs
          node --test tests/gdacs-feed-release.mjs
