name: WeatherX staging model display qualification
# Data preparation only: no automatic event, serving-pointer mutation or UI deploy.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact approved original collector SHA
        required: true
        type: string
      validator_sha:
        description: Exact approved Atmos display validator SHA
        required: true
        type: string
      model:
        description: One completed encrypted model archive
        required: true
        type: choice
        options: [icon, hrrr-ak, hrdps, nam, nam-hi, nam-ak, arome-antilles]
      init:
        description: Exact fresh UTC YYYYMMDDHH source cycle
        required: true
        type: string
      archive_run_id:
        description: Original model-inputs Actions run
        required: true
        type: string
      archive_attempt:
        description: Original model-inputs Actions attempt
        required: true
        type: string
      archive_receipt_sha256:
        description: Exact plaintext cloud-input-receipt digest
        required: true
        type: string
      archive_marker_sha256:
        description: Exact immutable complete.json byte digest
        required: true
        type: string
      prior_catalog_id:
        description: Previous isolated model catalog ID or literal none for approved first admission
        required: true
        type: string
      prior_catalog_sha256:
        description: Previous isolated model catalog hash or literal none
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: weatherx-staging-model-components-${{ inputs.model }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: data-staging
      url: https://staging.weatherx.org
    env:
      STAGING_DATA_ISOLATION_APPROVED: ${{ vars.STAGING_DATA_ISOLATION_APPROVED }}
      STAGING_MODEL_COMPONENTS_ENABLED: ${{ vars.STAGING_MODEL_COMPONENTS_ENABLED }}
      STAGING_MODEL_COMPONENTS_APPROVED_REQUESTS_JSON: ${{ vars.STAGING_MODEL_COMPONENTS_APPROVED_REQUESTS_JSON }}
      STAGING_MODEL_APPROVED_SOURCE_SHA: ${{ vars.STAGING_MODEL_APPROVED_SOURCE_SHA }}
      STAGING_MODEL_VALIDATOR_SOURCE_SHA: ${{ vars.STAGING_MODEL_VALIDATOR_SOURCE_SHA }}
      STAGING_R2_ACCOUNT_ID: ${{ vars.STAGING_R2_ACCOUNT_ID }}
      MODEL_SOURCE_SHA: ${{ inputs.source_sha }}
      MODEL_VALIDATOR_SHA: ${{ inputs.validator_sha }}
      MODEL_ID: ${{ inputs.model }}
      MODEL_INIT: ${{ inputs.init }}
      ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
      ARCHIVE_RUN_ATTEMPT: ${{ inputs.archive_attempt }}
      ARCHIVE_RECEIPT_SHA256: ${{ inputs.archive_receipt_sha256 }}
      ARCHIVE_MARKER_SHA256: ${{ inputs.archive_marker_sha256 }}
      PRIOR_CATALOG_ID: ${{ inputs.prior_catalog_id }}
      PRIOR_CATALOG_SHA256: ${{ inputs.prior_catalog_sha256 }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Refuse unapproved identity, source, prior selection or target before private checkout
        run: node cycle/tools/staging-model-components.mjs gate
      - name: Checkout approved scientific validator with full source ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ref: ${{ inputs.validator_sha }}
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout unchanged staging consumer for actual schema validation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ref: a58eff158b56ef2ba25189d2b859315b00893a14
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: control
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Install locked dependencies without archive or publication secrets
        run: |
          test "$(git -C atmos rev-parse HEAD)" = "$MODEL_VALIDATOR_SHA"
          git -C atmos diff --quiet HEAD
          python -m pip install --disable-pip-version-check -r atmos/data/requirements.txt
          npm ci --ignore-scripts --prefix cycle/staging-controller
      - name: Test private transport and actual pinned reader before accessing archives
        env:
          STAGING_CONSUMER_ROOT: ${{ github.workspace }}/control
        run: |
          node --test cycle/tests/staging-model-components*.mjs
          python atmos/experiments/models/test_qualify_cloud_model_display.py
      - name: Restore exact encrypted archive privately; no weather acquisition
        timeout-minutes: 25
        env:
          STAGING_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_WRITE_ACCESS_KEY_ID }}
          STAGING_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_WRITE_SECRET_ACCESS_KEY }}
          MODEL_INPUT_ARCHIVE_KEY: ${{ secrets.MODEL_INPUT_ARCHIVE_KEY }}
        run: node cycle/tools/staging-model-components.mjs restore
      - name: Revalidate raw science and construct sanitized display without cloud credentials
        timeout-minutes: 40
        run: |
          node cycle/tools/staging-model-components.mjs gate
          mkdir -p "$RUNNER_TEMP/weatherx-staging-model-display"
          python atmos/experiments/models/qualify_cloud_model_display.py \
            --archive-root "$RUNNER_TEMP/weatherx-model-inputs/$MODEL_ID" \
            --archive-receipt-sha256 "$ARCHIVE_RECEIPT_SHA256" \
            --archive-marker "$RUNNER_TEMP/weatherx-staging-model-control/$MODEL_ID/archive-marker.json" \
            --archive-marker-sha256 "$ARCHIVE_MARKER_SHA256" \
            --collector-sha "$MODEL_SOURCE_SHA" --validator-sha "$MODEL_VALIDATOR_SHA" \
            --model "$MODEL_ID" --init "$MODEL_INIT" \
            --source-run-id "$ARCHIVE_RUN_ID" --source-run-attempt "$ARCHIVE_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/weatherx-staging-model-display/$MODEL_ID"
      - name: Prepare immutable staging display and pinned catalog; never activate
        timeout-minutes: 20
        env:
          STAGING_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_WRITE_ACCESS_KEY_ID }}
          STAGING_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_WRITE_SECRET_ACCESS_KEY }}
        run: node cycle/tools/staging-model-components.mjs publish
# No Actions artifacts: even failed sanitizer/restore output stays private.
# Approved minimal selection receipt is retained in the fixed staging control prefix.
