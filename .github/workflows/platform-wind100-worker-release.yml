# One-time, exact-source production Worker release. No data, Pages, Stripe, or secret writes.
name: WeatherX production Wind100 Worker release
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RELEASE-PRODUCTION-WIND100-WORKER
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: weatherx-production-data-edge
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    environment:
      name: production
      url: https://weatherx.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATMOS_SHA: 7497b9815f1f5ca657cda8ed24ad5894afa267e0
      ATMOS_ROOT: ${{ github.workspace }}/atmos
      WORKER_RELEASE_ENVIRONMENT: production
    steps:
      - name: Require exact one-time production release confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = RELEASE-PRODUCTION-WIND100-WORKER
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: cycle
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: 7497b9815f1f5ca657cda8ed24ad5894afa267e0
          fetch-depth: 0
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
          persist-credentials: false
      - name: Verify exact master source and a clean release checkout
        run: |
          test "$(git -C cycle rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C atmos rev-parse HEAD)" = "$ATMOS_SHA"
          test "$(git -C atmos rev-parse refs/remotes/origin/master)" = "$ATMOS_SHA"
          git -C cycle diff --exit-code HEAD
          git -C atmos diff --exit-code HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atmos/platform/edge/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact Python test dependencies used by Atmos platform CI
        run: python3 -m pip install pillow==12.2.0 numpy==2.4.6 eccodes==2.47.0 requests==2.34.2
      - name: Install locked Worker dependencies
        working-directory: atmos/platform/edge
        run: npm ci --ignore-scripts
      - name: Run complete Worker checks and production config gate
        working-directory: atmos/platform/edge
        run: |
          node --test "$GITHUB_WORKSPACE/cycle/tests/platform-wind100-worker-release.mjs" "$GITHUB_WORKSPACE/cycle/tests/platform-wind100-route.mjs"
          npm run check
          node scripts/verify-config.mjs production
          npx wrangler deploy --dry-run --env production
      - name: Attach only the reviewed production Wind100 route
        id: attach_route
        env:
          DATA_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_DATA_EDGE_API_TOKEN }}
          ROUTE_RECEIPT: ${{ runner.temp }}/platform-wind100-release/route-receipt.json
        run: node cycle/tools/platform-wind100-route.mjs attach
      - name: Upload one inactive version, activate it, and verify live Wind100
        id: release_worker
        env:
          PLATFORM_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          RECEIPT: ${{ runner.temp }}/platform-wind100-release/receipt.json
        run: node cycle/tools/platform-wind100-worker-release.mjs release
      - name: Restore only this run's Worker version if verification failed
        if: ${{ always() && (steps.release_worker.outcome == 'failure' || steps.release_worker.outcome == 'cancelled') }}
        env:
          PLATFORM_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          RECEIPT: ${{ runner.temp }}/platform-wind100-release/receipt.json
        run: node cycle/tools/platform-wind100-worker-release.mjs recover
      - name: Remove only this run's route if the Worker release failed
        if: ${{ always() && (steps.attach_route.outcome == 'failure' || steps.release_worker.outcome == 'failure' || steps.release_worker.outcome == 'cancelled') }}
        env:
          DATA_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_DATA_EDGE_API_TOKEN }}
          ROUTE_RECEIPT: ${{ runner.temp }}/platform-wind100-release/route-receipt.json
        run: node cycle/tools/platform-wind100-route.mjs recover
      - name: Retain non-sensitive release and rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-wind100-worker-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-wind100-release/*.json
          if-no-files-found: ignore
          retention-days: 30
