name: WeatherX catalog bootstrap
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  staging:
    concurrency:
      group: weatherx-catalog-bootstrap-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout WeatherX
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Install the S3-compatible transfer client
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
      - name: Prove the publisher can access both staging rollout buckets
        env:
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: |
          rclone lsf weatherx:weatherx-data-staging --max-depth 1 --s3-no-check-bucket >/dev/null
          rclone lsf weatherx:weatherx-components-staging --max-depth 1 --s3-no-check-bucket >/dev/null
      - name: Mirror the current whole-release fallback
        working-directory: atmos
        env:
          LIVE: https://atmos-platform-dnp.pages.dev
        run: bash ops/mirror-live-data.sh
      - name: Publish and byte-verify the immutable staging fallback
        working-directory: atmos
        env:
          R2_REMOTE: weatherx:weatherx-data-staging
          RELEASE_ID: bootstrap-${{ github.run_id }}
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/platform/publish-r2-release.sh
      - name: Publish and CAS-promote the four current model components
        working-directory: atmos
        env:
          CONFIRM_SHADOW_BOOTSTRAP: '1'
          BOOTSTRAP_LIVE: https://atmos-platform-dnp.pages.dev
          CATALOG_R2_REMOTE: weatherx:weatherx-data-staging
          COMPONENT_R2_REMOTE: weatherx:weatherx-components-staging
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY }}
        run: bash ops/platform/bootstrap-r2-catalog.sh
