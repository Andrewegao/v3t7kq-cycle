name: WeatherX catalog bootstrap
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  staging:
    concurrency:
      group: weatherx-catalog-bootstrap-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout WeatherX
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Prove existing token can access only the staging rollout buckets
        working-directory: atmos
        env:
          CLOUDFLARE_ACCOUNT_ID: a89f9a1af485021fbc60a68b163c7c6e
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node ops/platform/r2-rest.mjs list weatherx-data-staging '' >/dev/null
          node ops/platform/r2-rest.mjs list weatherx-components-staging '' >/dev/null
      - name: Mirror the current whole-release fallback
        working-directory: atmos
        env:
          LIVE: https://atmos-platform-dnp.pages.dev
        run: bash ops/mirror-live-data.sh
      - name: Publish and byte-verify the immutable staging fallback
        working-directory: atmos
        env:
          R2_BUCKET: weatherx-data-staging
          RELEASE_ID: bootstrap-${{ github.run_id }}
          CLOUDFLARE_ACCOUNT_ID: a89f9a1af485021fbc60a68b163c7c6e
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash ops/platform/publish-r2-release.sh
      - name: Publish and CAS-promote the four current model components
        working-directory: atmos
        env:
          CONFIRM_SHADOW_BOOTSTRAP: '1'
          BOOTSTRAP_LIVE: https://atmos-platform-dnp.pages.dev
          CATALOG_R2_BUCKET: weatherx-data-staging
          COMPONENT_R2_BUCKET: weatherx-components-staging
          CLOUDFLARE_ACCOUNT_ID: a89f9a1af485021fbc60a68b163c7c6e
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY }}
        run: bash ops/platform/bootstrap-r2-catalog.sh
