name: WeatherX staging forecast evidence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weatherx-fusion-staging-evidence
  cancel-in-progress: false
jobs:
  record:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENGINE_SHA: ${{ vars.FUSION_STAGING_ENGINE_SHA }}
      FUSION_CALIBRATION_RUNTIME_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cycle
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - name: Require explicit staging engine pin
        run: '[[ "$ENGINE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: weatherx-hq/atmos
          ref: ${{ env.ENGINE_SHA }}
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
          persist-credentials: false
      - name: Verify clean pinned source and local policy tests
        run: |
          test "$(git -C atmos rev-parse HEAD)" = "$ENGINE_SHA"
          test -z "$(git -C atmos status --porcelain)"
          node --test cycle/tests/fusion-staging-evidence.mjs
          npm ci --prefix atmos/app
      - name: Require direct independent observations before any collection
        # No WeatherX proxy is allowed, even for a staging archive.
        working-directory: atmos
        run: |
          app/node_modules/.bin/tsx -e "import { canonicalObservationUrl } from './ops/fusion/collection-provenance'; import { directObservation } from '../cycle/tools/fusion-staging-evidence.mjs'; directObservation(canonicalObservationUrl('ZUCK'));"
      - name: Verify live isolated archive and reader bindings and no customer routes
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FUSION_DEPLOY_API_TOKEN }}
        run: node cycle/tools/fusion-staging-evidence.mjs preflight "$RUNNER_TEMP/fusion-staging-evidence"
      - name: Record prospective issuance and independent observations
        id: collect
        working-directory: atmos
        env:
          FUSION_ISSUANCE_KEY: ${{ secrets.FUSION_ISSUANCE_KEY }}
          FUSION_ALLOW_CUSTOM_SIGNED_ORIGIN: '1'
          READ_ORIGIN: ${{ steps.preflight.outputs.read_origin }}
          ARCHIVE_ORIGIN: ${{ steps.preflight.outputs.archive_origin }}
          CONTROL_ORIGIN: ${{ steps.preflight.outputs.read_origin }}
        run: |
          app/node_modules/.bin/tsx ops/fusion/cli.ts collect --publish --max-stations 64 --origin "$READ_ORIGIN" --archive-origin "$ARCHIVE_ORIGIN" --control-origin "$CONTROL_ORIGIN" --out "$RUNNER_TEMP/fusion-staging-evidence"
      - name: Account for every frozen station
        id: receipt
        run: node cycle/tools/fusion-staging-evidence.mjs receipt "$RUNNER_TEMP/fusion-staging-evidence"
      - name: Pull only the staging archive for matching
        id: pull
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        working-directory: atmos
        env:
          FUSION_ARCHIVE_READ_KEY: ${{ secrets.FUSION_ARCHIVE_READ_KEY }}
          FUSION_ALLOW_CUSTOM_SIGNED_ORIGIN: '1'
          ARCHIVE_ORIGIN: ${{ steps.preflight.outputs.archive_origin }}
        run: |
          app/node_modules/.bin/tsx ops/fusion/cli.ts pull --days 7 --archive-origin "$ARCHIVE_ORIGIN" --out "$RUNNER_TEMP/fusion-staging-archive"
      - name: Match forecast and observations without fitting or publishing accuracy
        id: score
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        working-directory: atmos
        run: |
          app/node_modules/.bin/tsx ops/fusion/cli.ts score --archive "$RUNNER_TEMP/fusion-staging-archive" --out "$RUNNER_TEMP/fusion-staging-evidence"
      - name: Always retain bounded outcome and gap record
        if: ${{ always() }}
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
          PULL_OUTCOME: ${{ steps.pull.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        run: node cycle/tools/fusion-staging-evidence.mjs gap "$RUNNER_TEMP/fusion-staging-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: fusion-staging-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fusion-staging-evidence/isolation.json
            ${{ runner.temp }}/fusion-staging-evidence/collection-receipt.json
            ${{ runner.temp }}/fusion-staging-evidence/collection-status.json
            ${{ runner.temp }}/fusion-staging-evidence/run-status.json
            ${{ runner.temp }}/fusion-staging-evidence/snapshot.json
            ${{ runner.temp }}/fusion-staging-evidence/accuracy/fusion-current.json
          if-no-files-found: error
          retention-days: 90
