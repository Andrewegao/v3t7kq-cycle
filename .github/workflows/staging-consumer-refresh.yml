name: WeatherX staging public consumer repair
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Normal upload or explicit reuse of the one reviewed retained version
        type: choice
        options: [upload, reuse-owned-33988771315]
        default: upload
      confirm:
        description: REFRESH-STAGING-CONSUMER or REUSE-STAGING-33988771315 for the selected mode
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: weatherx-staging-publication
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: data-staging
      url: https://staging.weatherx.org
    env:
      CONFIRM: ${{ inputs.confirm }}
      STAGING_CONSUMER_MODE: ${{ inputs.mode || 'upload' }}
      STAGING_CONSUMER_ENABLED: ${{ vars.STAGING_CONSUMER_ENABLED }}
      STAGING_CONSUMER_SOURCE_SHA: 0aa9fbed9e179ab2ccb6ac456727b9f33124ddb6
      STAGING_R2_ACCOUNT_ID: ${{ vars.STAGING_R2_ACCOUNT_ID }}
      STAGING_CONSUMER_APPROVED_VERSION: ${{ vars.STAGING_CONSUMER_APPROVED_VERSION }}
      STAGING_CONSUMER_APPROVED_SETTINGS_SHA256: ${{ vars.STAGING_CONSUMER_APPROVED_SETTINGS_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Install locked staging controller dependencies before importing the gate
        run: npm ci --ignore-scripts --prefix cycle/staging-controller
      - name: Refuse any unapproved target, source or invocation
        run: node --input-type=module -e "import {consumerGate} from './cycle/tools/staging-consumer.mjs'; consumerGate(process.env)"
      - name: Checkout only the fixed already-qualified staging consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ref: 0aa9fbed9e179ab2ccb6ac456727b9f33124ddb6
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: control
          persist-credentials: false
      - name: Install locked dependencies without a deployment credential
        working-directory: control/platform/edge
        run: |
          npm ci
          python -m pip install pillow
      - name: Full consumer checks and controller rollback contracts
        run: |
          npm run check --prefix control/platform/edge
          node --test cycle/tests/staging-consumer.mjs cycle/tests/staging-consumer-diagnostics.mjs cycle/tests/staging-consumer-reuse.mjs cycle/tests/staging-consumer-readiness.mjs
          python cycle/tests/staging-consumer-reuse.py
      - name: Admit the exact retained owned receipt without cloud credentials
        if: ${{ inputs.mode == 'reuse-owned-33988771315' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cycle/tools/staging-consumer-reuse.py --output "$RUNNER_TEMP/staging-consumer/origin.json"
      - name: Read-only live boundary check
        env:
          STAGING_WORKER_API_TOKEN: ${{ secrets.STAGING_WORKER_API_TOKEN }}
        run: |
          if [ "$STAGING_CONSUMER_MODE" = reuse-owned-33988771315 ]; then
            node cycle/tools/staging-consumer.mjs preflight-reuse control "$RUNNER_TEMP/staging-consumer/receipt.json"
          else
            node cycle/tools/staging-consumer.mjs preflight control "$RUNNER_TEMP/staging-consumer/receipt.json"
          fi
      - name: Guarded staging-only inactive upload and public-mode repair
        if: ${{ inputs.mode != 'reuse-owned-33988771315' }}
        id: refresh
        timeout-minutes: 9
        env:
          STAGING_WORKER_API_TOKEN: ${{ secrets.STAGING_WORKER_API_TOKEN }}
          SHARED_READ_ACCESS_KEY_ID: ${{ secrets.SHARED_R2_READ_ACCESS_KEY_ID }}
          SHARED_READ_SECRET_ACCESS_KEY: ${{ secrets.SHARED_R2_READ_SECRET_ACCESS_KEY }}
        run: node cycle/tools/staging-consumer.mjs execute control "$RUNNER_TEMP/staging-consumer/receipt.json"
      - name: Reuse only the reviewed owned staging version without upload
        if: ${{ inputs.mode == 'reuse-owned-33988771315' }}
        id: reuse
        timeout-minutes: 9
        env:
          STAGING_WORKER_API_TOKEN: ${{ secrets.STAGING_WORKER_API_TOKEN }}
        run: node cycle/tools/staging-consumer.mjs execute-reuse control "$RUNNER_TEMP/staging-consumer/receipt.json"
      - name: Recover prior staging version after interrupted activation
        if: ${{ always() && (steps.refresh.outcome == 'failure' || steps.refresh.outcome == 'cancelled' || steps.reuse.outcome == 'failure' || steps.reuse.outcome == 'cancelled') }}
        timeout-minutes: 5
        env:
          STAGING_WORKER_API_TOKEN: ${{ secrets.STAGING_WORKER_API_TOKEN }}
        run: node cycle/tools/staging-consumer.mjs recover control "$RUNNER_TEMP/staging-consumer/receipt.json"
      - name: Retain non-secret staging boundary receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-consumer/receipt.json
          if-no-files-found: ignore
          retention-days: 14
