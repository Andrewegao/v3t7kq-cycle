# Collect additional model inputs only. No production authority, UI deployment,
# serving mount, catalog promotion, or public Actions data artifact/cache.
name: WeatherX experimental model cloud inputs
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed Atmos collector commit approved in data-staging
        required: true
        type: string
      init:
        description: Explicit fresh UTC six-hour cycle YYYYMMDDHH (all 49 hourly leads required)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: weatherx-experimental-model-inputs
  cancel-in-progress: false
jobs:
  # DWD, ECCC and Meteo-France are independent providers. Start their single
  # model families together instead of letting NOAA jobs occupy every runner.
  collect-independent:
    environment:
      name: data-staging
      url: https://staging.weatherx.org
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: [icon, hrdps, arome-antilles]
    env:
      STAGING_DATA_ISOLATION_APPROVED: ${{ vars.STAGING_DATA_ISOLATION_APPROVED }}
      STAGING_MODEL_COLLECTION_ENABLED: ${{ vars.STAGING_MODEL_COLLECTION_ENABLED }}
      STAGING_MODEL_APPROVED_SOURCE_SHA: ${{ vars.STAGING_MODEL_APPROVED_SOURCE_SHA }}
      STAGING_R2_ACCOUNT_ID: ${{ vars.STAGING_R2_ACCOUNT_ID }}
      MODEL_SOURCE_SHA: ${{ inputs.source_sha }}
      MODEL_INIT: ${{ inputs.init }}
      MODEL_ID: ${{ matrix.model }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cycle/staging-controller/package-lock.json
      - name: Refuse unapproved source, stale cycle, local execution or non-staging authority
        run: node cycle/tools/model-inputs.mjs gate
      - name: Checkout exact approved additional-model collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
          persist-credentials: false
          fetch-depth: 0
      - name: Verify actual source checkout and log runner resources before acquisition
        run: |
          test "$(git -C atmos rev-parse HEAD)" = "$MODEL_SOURCE_SHA"
          git -C atmos diff --quiet HEAD
          df -h "$RUNNER_TEMP"
          free -m
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: atmos/data/requirements.txt
      - name: Install pinned scientific and transfer dependencies without R2 credentials
        run: |
          python -m pip install --disable-pip-version-check -r atmos/data/requirements.txt
          npm ci --ignore-scripts --prefix cycle/staging-controller
      - name: Verify orchestration and archive boundaries without weather downloads or credentials
        run: |
          python atmos/experiments/models/test_cloud_model_inputs.py
          node --test cycle/tests/model-inputs*.mjs
      - name: Collect and verify one exact model; retain raw floats and private receipts
        timeout-minutes: 45
        run: |
          node cycle/tools/model-inputs.mjs gate
          python atmos/experiments/models/cloud_model_inputs.py \
            --model "$MODEL_ID" --init "$MODEL_INIT" --source-sha "$MODEL_SOURCE_SHA" \
            --workers 2 --output "$RUNNER_TEMP/weatherx-model-inputs/$MODEL_ID"
      - name: Encrypt and immutably archive to staging only; verify full remote bytes
        timeout-minutes: 30
        env:
          STAGING_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_WRITE_ACCESS_KEY_ID }}
          STAGING_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_WRITE_SECRET_ACCESS_KEY }}
          MODEL_INPUT_ARCHIVE_KEY: ${{ secrets.MODEL_INPUT_ARCHIVE_KEY }}
        run: node cycle/tools/model-inputs.mjs archive

  # HRRR-AK and all NAM nests share NOAA endpoints. Acquire them sequentially
  # on one runner, then archive at most two completed models at once. This keeps
  # provider pressure bounded while overlapping the independent families above.
  collect:
    environment:
      name: data-staging
      url: https://staging.weatherx.org
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STAGING_DATA_ISOLATION_APPROVED: ${{ vars.STAGING_DATA_ISOLATION_APPROVED }}
      STAGING_MODEL_COLLECTION_ENABLED: ${{ vars.STAGING_MODEL_COLLECTION_ENABLED }}
      STAGING_MODEL_APPROVED_SOURCE_SHA: ${{ vars.STAGING_MODEL_APPROVED_SOURCE_SHA }}
      STAGING_R2_ACCOUNT_ID: ${{ vars.STAGING_R2_ACCOUNT_ID }}
      MODEL_SOURCE_SHA: ${{ inputs.source_sha }}
      MODEL_INIT: ${{ inputs.init }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cycle/staging-controller/package-lock.json
      - name: Refuse unapproved source, stale cycle, local execution or non-staging authority
        run: |
          for model in hrrr-ak nam nam-hi nam-ak; do
            MODEL_ID="$model" node cycle/tools/model-inputs.mjs gate >/dev/null
          done
      - name: Checkout exact approved additional-model collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
          persist-credentials: false
          fetch-depth: 0
      - name: Verify actual source checkout and log runner resources before acquisition
        run: |
          test "$(git -C atmos rev-parse HEAD)" = "$MODEL_SOURCE_SHA"
          git -C atmos diff --quiet HEAD
          df -h "$RUNNER_TEMP"
          free -m
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: atmos/data/requirements.txt
      - name: Install pinned scientific and transfer dependencies without R2 credentials
        run: |
          python -m pip install --disable-pip-version-check -r atmos/data/requirements.txt
          npm ci --ignore-scripts --prefix cycle/staging-controller
      - name: Verify orchestration and archive boundaries without weather downloads or credentials
        run: |
          python atmos/experiments/models/test_cloud_model_inputs.py
          node --test cycle/tests/model-inputs*.mjs
      - name: Collect and verify the exact NOAA family sequentially; retain raw floats and private receipts
        id: collect_noaa
        continue-on-error: true
        timeout-minutes: 60
        run: bash cycle/tools/model-inputs-noaa.sh collect
      - name: Encrypt and immutably archive the NOAA family to staging only; verify full remote bytes
        id: archive_noaa
        if: ${{ always() && steps.collect_noaa.outputs.completed != '' }}
        continue-on-error: true
        timeout-minutes: 60
        env:
          STAGING_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_WRITE_ACCESS_KEY_ID }}
          STAGING_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_WRITE_SECRET_ACCESS_KEY }}
          MODEL_INPUT_ARCHIVE_KEY: ${{ secrets.MODEL_INPUT_ARCHIVE_KEY }}
          MODEL_INPUTS_COMPLETED: ${{ steps.collect_noaa.outputs.completed }}
        run: bash cycle/tools/model-inputs-noaa.sh archive
      - name: Refuse partial NOAA acquisition or archival
        if: ${{ always() }}
        env:
          NOAA_COLLECTION_OUTCOME: ${{ steps.collect_noaa.outcome }}
          NOAA_ARCHIVE_OUTCOME: ${{ steps.archive_noaa.outcome }}
          NOAA_COMPLETED_MODELS: ${{ steps.collect_noaa.outputs.completed }}
        run: |
          test "$NOAA_COLLECTION_OUTCOME" = success
          test "$NOAA_ARCHIVE_OUTCOME" = success
          test "$NOAA_COMPLETED_MODELS" = "hrrr-ak nam nam-hi nam-ak"
