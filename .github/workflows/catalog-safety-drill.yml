name: WeatherX staging catalog safety drill
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN-STAGING-DRILL to perform and automatically roll back the drill
        type: string
        required: true
jobs:
  staging:
    concurrency:
      group: weatherx-catalog-safety-drill-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit staging confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = RUN-STAGING-DRILL
      - name: Checkout WeatherX publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Install the pinned S3-compatible transfer client
        run: |
          archive="$RUNNER_TEMP/rclone-v1.75.0-linux-amd64.zip"
          curl --fail --silent --show-error --location \
            https://github.com/rclone/rclone/releases/download/v1.75.0/rclone-v1.75.0-linux-amd64.zip \
            --output "$archive"
          printf '%s  %s\n' 'aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa' "$archive" | sha256sum --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/rclone-v1.75.0-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1 | grep -Fx 'rclone v1.75.0'
      - name: Capture and verify the pre-drill catalog
        env:
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: |
          pointer="$RUNNER_TEMP/original-pointer.json"
          snapshot="$RUNNER_TEMP/original-catalog.json"
          rclone copyto weatherx:weatherx-data-staging/catalogs/current.json "$pointer" --s3-no-check-bucket
          catalog_id="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1])).catalogId)' "$pointer")"
          rclone copyto "weatherx:weatherx-data-staging/catalogs/snapshots/$catalog_id.json" "$snapshot" --s3-no-check-bucket
          node --input-type=module - "$pointer" "$snapshot" <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const [pointerPath, snapshotPath] = process.argv.slice(2);
          const pointer = JSON.parse(fs.readFileSync(pointerPath, 'utf8'));
          const bytes = fs.readFileSync(snapshotPath);
          const catalog = JSON.parse(bytes);
          const core = ['ecmwf', 'gfs', 'hrrr', 'aifs'];
          if (createHash('sha256').update(bytes).digest('hex') !== pointer.catalogSha256 ||
              catalog.sequence !== pointer.sequence || catalog.createdAt !== pointer.publishedAt ||
              catalog.parentCatalogId !== pointer.previousCatalogId ||
              !core.every((model) => catalog.components?.[model]?.quality?.status === 'passed')) {
            throw new Error('pre-drill catalog is incomplete or failed integrity verification');
          }
          NODE
          original_epoch="$(node -e 'process.stdout.write(String(JSON.parse(require("node:fs").readFileSync(process.argv[1])).rollbackEpoch ?? 0))' "$snapshot")"
          original_sequence="$(node -e 'process.stdout.write(String(JSON.parse(require("node:fs").readFileSync(process.argv[1])).sequence))' "$snapshot")"
          printf 'ORIGINAL_CATALOG_ID=%s\nORIGINAL_EPOCH=%s\nORIGINAL_SEQUENCE=%s\n' \
            "$catalog_id" "$original_epoch" "$original_sequence" >> "$GITHUB_ENV"
      - name: Race two independent immutable component promotions
        working-directory: atmos
        env:
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
          COMPONENT_R2_REMOTE: weatherx:weatherx-components-staging
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY }}
        run: |
          generation_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for lane in a b; do
            mkdir -p "$RUNNER_TEMP/drill-$lane"
            printf '{"catalogSafetyDrill":"%s","runId":"%s"}\n' "$lane" "$GITHUB_RUN_ID" \
              > "$RUNNER_TEMP/drill-$lane/receipt.json"
          done
          publish_lane() {
            lane="$1"
            component_id="catalog-drill-$lane"
            SOURCE_DIR="$RUNNER_TEMP/drill-$lane" \
            COMPONENT_ID="$component_id" \
            ARTIFACT_ID="$component_id-$GITHUB_RUN_ID" \
            GENERATION_TIME="$generation_time" \
            MOUNT="data-atmos/$component_id/" \
            COMPONENT_QUALITY_CHECKS=catalog_safety_drill \
            EXPECTED_CATALOG_ROLLBACK_EPOCH="$ORIGINAL_EPOCH" \
              bash ops/platform/publish-r2-component.sh
          }
          publish_lane a > "$RUNNER_TEMP/drill-a.log" 2>&1 & pid_a=$!
          publish_lane b > "$RUNNER_TEMP/drill-b.log" 2>&1 & pid_b=$!
          failed=0
          wait "$pid_a" || failed=1
          wait "$pid_b" || failed=1
          cat "$RUNNER_TEMP/drill-a.log"
          cat "$RUNNER_TEMP/drill-b.log"
          test "$failed" = 0
      - name: Verify both concurrent winners without a lost update
        env:
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: |
          pointer="$RUNNER_TEMP/drill-pointer.json"
          snapshot="$RUNNER_TEMP/drill-catalog.json"
          rclone copyto weatherx:weatherx-data-staging/catalogs/current.json "$pointer" --s3-no-check-bucket
          catalog_id="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1])).catalogId)' "$pointer")"
          rclone copyto "weatherx:weatherx-data-staging/catalogs/snapshots/$catalog_id.json" "$snapshot" --s3-no-check-bucket
          node --input-type=module - "$RUNNER_TEMP/original-catalog.json" "$pointer" "$snapshot" "$ORIGINAL_SEQUENCE" <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const [originalPath, pointerPath, snapshotPath, sequenceText] = process.argv.slice(2);
          const original = JSON.parse(fs.readFileSync(originalPath, 'utf8'));
          const pointer = JSON.parse(fs.readFileSync(pointerPath, 'utf8'));
          const bytes = fs.readFileSync(snapshotPath);
          const catalog = JSON.parse(bytes);
          const core = ['ecmwf', 'gfs', 'hrrr', 'aifs'];
          if (createHash('sha256').update(bytes).digest('hex') !== pointer.catalogSha256 ||
              catalog.sequence !== Number(sequenceText) + 2 ||
              !['catalog-drill-a', 'catalog-drill-b'].every((id) => catalog.components?.[id]) ||
              !core.every((id) => catalog.components?.[id]?.manifestSha256 === original.components[id].manifestSha256)) {
            throw new Error('concurrent promotion drill lost an update or changed a core component');
          }
          NODE
          printf 'DRILL_CATALOG_ID=%s\nDRILL_PROMOTIONS_PASSED=1\n' "$catalog_id" >> "$GITHUB_ENV"
      - name: Roll back to the exact pre-drill catalog
        if: ${{ always() }}
        working-directory: atmos
        env:
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY }}
        run: |
          test -n "${ORIGINAL_CATALOG_ID:-}"
          rclone copyto weatherx:weatherx-data-staging/catalogs/current.json "$RUNNER_TEMP/pre-rollback-pointer.json" --s3-no-check-bucket
          current_id="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1])).catalogId)' "$RUNNER_TEMP/pre-rollback-pointer.json")"
          printf 'DRILL_CATALOG_ID=%s\n' "$current_id" >> "$GITHUB_ENV"
          if [ "$current_id" != "$ORIGINAL_CATALOG_ID" ]; then
            node ops/platform/submit-catalog-mutation.mjs rollback "$CATALOG_ENDPOINT" "$ORIGINAL_CATALOG_ID" "$current_id"
            printf 'ROLLBACK_PERFORMED=1\n' >> "$GITHUB_ENV"
          fi
      - name: Verify rollback, stale-bake fencing, and whole-release fallback
        if: ${{ always() }}
        working-directory: atmos
        env:
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY }}
        run: |
          pointer="$RUNNER_TEMP/rollback-pointer.json"
          snapshot="$RUNNER_TEMP/rollback-catalog.json"
          rclone copyto weatherx:weatherx-data-staging/catalogs/current.json "$pointer" --s3-no-check-bucket
          catalog_id="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1])).catalogId)' "$pointer")"
          rclone copyto "weatherx:weatherx-data-staging/catalogs/snapshots/$catalog_id.json" "$snapshot" --s3-no-check-bucket
          node --input-type=module - "$RUNNER_TEMP/original-catalog.json" "$pointer" "$snapshot" "$ORIGINAL_SEQUENCE" "$ORIGINAL_EPOCH" "$ORIGINAL_CATALOG_ID" "${DRILL_CATALOG_ID:-}" "${DRILL_PROMOTIONS_PASSED:-0}" <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const [originalPath, pointerPath, snapshotPath, sequenceText, epochText, originalId, drillId, drillPassed] = process.argv.slice(2);
          const original = JSON.parse(fs.readFileSync(originalPath, 'utf8'));
          const pointer = JSON.parse(fs.readFileSync(pointerPath, 'utf8'));
          const bytes = fs.readFileSync(snapshotPath);
          const catalog = JSON.parse(bytes);
          const originalDigests = Object.fromEntries(Object.entries(original.components).map(([id, value]) => [id, value.manifestSha256]));
          const currentDigests = Object.fromEntries(Object.entries(catalog.components).map(([id, value]) => [id, value.manifestSha256]));
          const integrityFailed = createHash('sha256').update(bytes).digest('hex') !== pointer.catalogSha256 ||
            JSON.stringify(currentDigests) !== JSON.stringify(originalDigests);
          const completedDrillFailed = drillPassed === '1' &&
            (catalog.sequence !== Number(sequenceText) + 3 || catalog.rollbackEpoch !== Number(epochText) + 1 ||
             pointer.rollbackOfCatalogId !== originalId || pointer.previousCatalogId !== drillId);
          if (integrityFailed || completedDrillFailed) {
            throw new Error('rollback did not restore the exact pre-drill component set');
          }
          NODE
          if [ "${DRILL_PROMOTIONS_PASSED:-0}" = 1 ]; then
            stale_manifest="components/catalog-drill-a/catalog-drill-a-$GITHUB_RUN_ID/component.json"
            rclone copyto "weatherx:weatherx-components-staging/$stale_manifest" "$RUNNER_TEMP/stale-component.json" --s3-no-check-bucket
            stale_sha="$(sha256sum "$RUNNER_TEMP/stale-component.json" | cut -d' ' -f1)"
            if node ops/platform/submit-catalog-mutation.mjs promote "$CATALOG_ENDPOINT" \
                "$stale_manifest" "$stale_sha" '' "$ORIGINAL_EPOCH" > "$RUNNER_TEMP/stale.log" 2>&1; then
              echo 'rollback failed to fence a stale bake' >&2
              exit 1
            fi
            grep -F catalog_epoch_changed "$RUNNER_TEMP/stale.log"
          fi
          rclone copyto weatherx:weatherx-data-staging/releases/current.json "$RUNNER_TEMP/release-pointer.json" --s3-no-check-bucket
          release_id="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1])).releaseId)' "$RUNNER_TEMP/release-pointer.json")"
          rclone copyto "weatherx:weatherx-data-staging/releases/$release_id/manifest.json" "$RUNNER_TEMP/release-manifest.json" --s3-no-check-bucket
          for model in ecmwf gfs hrrr aifs; do
            node ops/platform/verify-release-component.mjs verify \
              "$RUNNER_TEMP/release-pointer.json" "$RUNNER_TEMP/release-manifest.json" "$model" >/dev/null
          done
          test "${DRILL_PROMOTIONS_PASSED:-0}" = 1
          echo "staging catalog safety drill passed and restored catalog $ORIGINAL_CATALOG_ID as sequence $((ORIGINAL_SEQUENCE + 3))"
