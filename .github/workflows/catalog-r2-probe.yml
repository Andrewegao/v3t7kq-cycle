name: WeatherX catalog R2 scope probe
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout WeatherX
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
      - name: Install the S3-compatible transfer client
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
      - name: Verify staging access and deny production without mutating R2
        env:
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: |
          rclone lsf weatherx:weatherx-data-staging --max-depth 1 --s3-no-check-bucket >/dev/null
          rclone lsf weatherx:weatherx-components-staging --max-depth 1 --s3-no-check-bucket >/dev/null
          if rclone lsf weatherx:weatherx-data-production --max-depth 1 --s3-no-check-bucket >/dev/null 2>&1; then
            echo 'credential unexpectedly accessed weatherx-data-production' >&2
            exit 1
          fi
          if rclone lsf weatherx:weatherx-components-production --max-depth 1 --s3-no-check-bucket >/dev/null 2>&1; then
            echo 'credential unexpectedly accessed weatherx-components-production' >&2
            exit 1
          fi
          echo 'R2 credential is restricted to the two staging buckets'
