name: WeatherX catalog R2 scope probe
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout WeatherX
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
      - name: Install the S3-compatible transfer client
        run: |
          archive="$RUNNER_TEMP/rclone-v1.75.0-linux-amd64.zip"
          curl --fail --silent --show-error --location \
            https://github.com/rclone/rclone/releases/download/v1.75.0/rclone-v1.75.0-linux-amd64.zip \
            --output "$archive"
          printf '%s  %s\n' 'aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa' "$archive" | sha256sum --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/rclone-v1.75.0-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1 | grep -Fx 'rclone v1.75.0'
      - name: Verify staging access and deny production without mutating R2
        env:
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: |
          rclone lsf weatherx:weatherx-data-staging --max-depth 1 --s3-no-check-bucket >/dev/null
          rclone lsf weatherx:weatherx-components-staging --max-depth 1 --s3-no-check-bucket >/dev/null
          if rclone lsf weatherx:weatherx-data-production --max-depth 1 --s3-no-check-bucket >/dev/null 2>&1; then
            echo 'credential unexpectedly accessed weatherx-data-production' >&2
            exit 1
          fi
          if rclone lsf weatherx:weatherx-components-production --max-depth 1 --s3-no-check-bucket >/dev/null 2>&1; then
            echo 'credential unexpectedly accessed weatherx-components-production' >&2
            exit 1
          fi
          echo 'R2 credential is restricted to the two staging buckets'
      - name: Verify immutable write, read, and cleanup in the component staging bucket
        env:
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: |
          key="diagnostics/s3-write-${GITHUB_RUN_ID}.txt"
          remote="weatherx:weatherx-components-staging/$key"
          work="$(mktemp -d)"
          trap 'rclone deletefile "$remote" --s3-no-check-bucket >/dev/null 2>&1 || true; rm -rf "$work"' EXIT
          printf 'weatherx-r2-s3-probe-%s\n' "$GITHUB_RUN_ID" > "$work/expected.txt"
          rclone copyto "$work/expected.txt" "$remote" --immutable --s3-no-check-bucket
          rclone copyto "$remote" "$work/actual.txt" --s3-no-check-bucket
          cmp "$work/expected.txt" "$work/actual.txt"
          rclone deletefile "$remote" --s3-no-check-bucket
          trap - EXIT
          rm -rf "$work"
          echo 'R2 S3 immutable write and byte-read verified; diagnostic object removed'
