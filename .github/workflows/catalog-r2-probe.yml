name: WeatherX catalog R2 scope probe
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout WeatherX
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Verify read access without mutating R2
        working-directory: atmos
        env:
          CLOUDFLARE_ACCOUNT_ID: a89f9a1af485021fbc60a68b163c7c6e
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          node ops/platform/r2-rest.mjs list weatherx-data-staging '' >/dev/null
          node ops/platform/r2-rest.mjs list weatherx-components-staging '' >/dev/null
          echo 'R2 staging bucket read scope verified'
