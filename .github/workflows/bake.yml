# Unattended legacy data-maintenance cycle. It owns observations/truth, accuracy, vault, and
# ancillary data, then publishes one immutable whole-data release to production R2. It has no
# Pages credential and cannot deploy or overwrite the application shell.
name: bake
permissions:
  contents: read
  actions: read
on:
  schedule:
    - cron: '30 2,8,14,20 * * *'   # ~20 min after each ECMWF publication lands
  workflow_dispatch:               # manual data refresh; UI releases use ui-release.yml
    inputs:
      model:
        description: Refresh one model only, or all models plus whole maintenance; schedules always use all
        type: choice
        required: false
        default: all
        options: [all, ecmwf, gfs, hrrr, aifs, icon, hrdps, arome-antilles, hrrr-ak, nam, nam-hi, nam-ak]
      recovery_run_id:
        description: Optional reviewed failed run whose unchanged model inputs may be recovered
        type: string
        required: false
        default: ''
jobs:
  core-ecmwf:
    name: core (ecmwf)
    uses: ./.github/workflows/collect-core-model.yml
    if: ${{ inputs.model == '' || inputs.model == 'all' || inputs.model == 'ecmwf' }}
    with: { model: ecmwf, recovery_run_id: "${{ inputs.recovery_run_id || '' }}" }
    secrets: { ATMOS_DEPLOY_KEY: "${{ secrets.ATMOS_DEPLOY_KEY }}" }
  core-gfs:
    name: core (gfs)
    uses: ./.github/workflows/collect-core-model.yml
    if: ${{ inputs.model == '' || inputs.model == 'all' || inputs.model == 'gfs' }}
    with: { model: gfs, recovery_run_id: "${{ inputs.recovery_run_id || '' }}" }
    secrets: { ATMOS_DEPLOY_KEY: "${{ secrets.ATMOS_DEPLOY_KEY }}" }
  core-hrrr:
    name: core (hrrr)
    uses: ./.github/workflows/collect-core-model.yml
    if: ${{ inputs.model == '' || inputs.model == 'all' || inputs.model == 'hrrr' }}
    with: { model: hrrr, recovery_run_id: "${{ inputs.recovery_run_id || '' }}" }
    secrets: { ATMOS_DEPLOY_KEY: "${{ secrets.ATMOS_DEPLOY_KEY }}" }
  core-aifs:
    name: core (aifs)
    uses: ./.github/workflows/collect-core-model.yml
    if: ${{ inputs.model == '' || inputs.model == 'all' || inputs.model == 'aifs' }}
    with: { model: aifs, recovery_run_id: "${{ inputs.recovery_run_id || '' }}" }
    secrets: { ATMOS_DEPLOY_KEY: "${{ secrets.ATMOS_DEPLOY_KEY }}" }
  regional-icon:
    name: regional (icon)
    uses: ./.github/workflows/collect-regional-model.yml
    if: ${{ inputs.model == '' || inputs.model == 'all' || inputs.model == 'icon' }}
    with: { model: icon, recovery_run_id: "${{ inputs.recovery_run_id || '' }}" }
    secrets: { ATMOS_DEPLOY_KEY: "${{ secrets.ATMOS_DEPLOY_KEY }}" }
  regional-hrdps:
    name: regional (hrdps)
    uses: ./.github/workflows/collect-regional-model.yml
    if: ${{ inputs.model == '' || inputs.model == 'all' || inputs.model == 'hrdps' }}
    with: { model: hrdps, recovery_run_id: "${{ inputs.recovery_run_id || '' }}" }
    secrets: { ATMOS_DEPLOY_KEY: "${{ secrets.ATMOS_DEPLOY_KEY }}" }
  regional-arome-antilles:
    name: regional (arome-antilles)
    uses: ./.github/workflows/collect-regional-model.yml
    if: ${{ inputs.model == '' || inputs.model == 'all' || inputs.model == 'arome-antilles' }}
    with: { model: arome-antilles, recovery_run_id: "${{ inputs.recovery_run_id || '' }}" }
    secrets: { ATMOS_DEPLOY_KEY: "${{ secrets.ATMOS_DEPLOY_KEY }}" }
  regional-hrrr-ak:
    name: regional (hrrr-ak)
    uses: ./.github/workflows/collect-regional-model.yml
    if: ${{ inputs.model == '' || inputs.model == 'all' || inputs.model == 'hrrr-ak' }}
    with: { model: hrrr-ak, recovery_run_id: "${{ inputs.recovery_run_id || '' }}" }
    secrets: { ATMOS_DEPLOY_KEY: "${{ secrets.ATMOS_DEPLOY_KEY }}" }
  regional-nam:
    name: regional (nam)
    uses: ./.github/workflows/collect-regional-model.yml
    if: ${{ inputs.model == '' || inputs.model == 'all' || inputs.model == 'nam' }}
    with: { model: nam, recovery_run_id: "${{ inputs.recovery_run_id || '' }}" }
    secrets: { ATMOS_DEPLOY_KEY: "${{ secrets.ATMOS_DEPLOY_KEY }}" }
  regional-nam-hi:
    name: regional (nam-hi)
    uses: ./.github/workflows/collect-regional-model.yml
    if: ${{ inputs.model == '' || inputs.model == 'all' || inputs.model == 'nam-hi' }}
    with: { model: nam-hi, recovery_run_id: "${{ inputs.recovery_run_id || '' }}" }
    secrets: { ATMOS_DEPLOY_KEY: "${{ secrets.ATMOS_DEPLOY_KEY }}" }
  regional-nam-ak:
    name: regional (nam-ak)
    uses: ./.github/workflows/collect-regional-model.yml
    if: ${{ inputs.model == '' || inputs.model == 'all' || inputs.model == 'nam-ak' }}
    with: { model: nam-ak, recovery_run_id: "${{ inputs.recovery_run_id || '' }}" }
    secrets: { ATMOS_DEPLOY_KEY: "${{ secrets.ATMOS_DEPLOY_KEY }}" }
  publish-ecmwf:
    needs: core-ecmwf
    if: ${{ needs.core-ecmwf.result == 'success' && vars.CURRENT_RUN_COMPONENT_PUBLISH_ENABLED == 'true' }}
    uses: ./.github/workflows/publish-current-model-production.yml
    with: { model: ecmwf, kind: core }
    secrets:
      ATMOS_DEPLOY_KEY: ${{ secrets.ATMOS_DEPLOY_KEY }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
      CATALOG_ENDPOINT_PRODUCTION: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
      CATALOG_PROMOTION_KEY_PRODUCTION: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
  publish-gfs:
    needs: core-gfs
    if: ${{ needs.core-gfs.result == 'success' && vars.CURRENT_RUN_COMPONENT_PUBLISH_ENABLED == 'true' }}
    uses: ./.github/workflows/publish-current-model-production.yml
    with: { model: gfs, kind: core }
    secrets:
      ATMOS_DEPLOY_KEY: ${{ secrets.ATMOS_DEPLOY_KEY }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
      CATALOG_ENDPOINT_PRODUCTION: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
      CATALOG_PROMOTION_KEY_PRODUCTION: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
  publish-hrrr:
    needs: core-hrrr
    if: ${{ needs.core-hrrr.result == 'success' && vars.CURRENT_RUN_COMPONENT_PUBLISH_ENABLED == 'true' }}
    uses: ./.github/workflows/publish-current-model-production.yml
    with: { model: hrrr, kind: core }
    secrets:
      ATMOS_DEPLOY_KEY: ${{ secrets.ATMOS_DEPLOY_KEY }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
      CATALOG_ENDPOINT_PRODUCTION: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
      CATALOG_PROMOTION_KEY_PRODUCTION: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
  publish-aifs:
    needs: core-aifs
    if: ${{ needs.core-aifs.result == 'success' && vars.CURRENT_RUN_COMPONENT_PUBLISH_ENABLED == 'true' }}
    uses: ./.github/workflows/publish-current-model-production.yml
    with: { model: aifs, kind: core }
    secrets:
      ATMOS_DEPLOY_KEY: ${{ secrets.ATMOS_DEPLOY_KEY }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
      CATALOG_ENDPOINT_PRODUCTION: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
      CATALOG_PROMOTION_KEY_PRODUCTION: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
  publish-icon:
    needs: regional-icon
    if: ${{ needs.regional-icon.result == 'success' && vars.CURRENT_RUN_COMPONENT_PUBLISH_ENABLED == 'true' }}
    uses: ./.github/workflows/publish-current-model-production.yml
    with: { model: icon, kind: regional }
    secrets:
      ATMOS_DEPLOY_KEY: ${{ secrets.ATMOS_DEPLOY_KEY }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
      CATALOG_ENDPOINT_PRODUCTION: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
      CATALOG_PROMOTION_KEY_PRODUCTION: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
  publish-hrdps:
    needs: regional-hrdps
    if: ${{ needs.regional-hrdps.result == 'success' && vars.CURRENT_RUN_COMPONENT_PUBLISH_ENABLED == 'true' }}
    uses: ./.github/workflows/publish-current-model-production.yml
    with: { model: hrdps, kind: regional }
    secrets:
      ATMOS_DEPLOY_KEY: ${{ secrets.ATMOS_DEPLOY_KEY }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
      CATALOG_ENDPOINT_PRODUCTION: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
      CATALOG_PROMOTION_KEY_PRODUCTION: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
  publish-arome-antilles:
    needs: regional-arome-antilles
    if: ${{ needs.regional-arome-antilles.result == 'success' && vars.CURRENT_RUN_COMPONENT_PUBLISH_ENABLED == 'true' }}
    uses: ./.github/workflows/publish-current-model-production.yml
    with: { model: arome-antilles, kind: regional }
    secrets:
      ATMOS_DEPLOY_KEY: ${{ secrets.ATMOS_DEPLOY_KEY }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
      CATALOG_ENDPOINT_PRODUCTION: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
      CATALOG_PROMOTION_KEY_PRODUCTION: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
  publish-hrrr-ak:
    needs: regional-hrrr-ak
    if: ${{ needs.regional-hrrr-ak.result == 'success' && vars.CURRENT_RUN_COMPONENT_PUBLISH_ENABLED == 'true' }}
    uses: ./.github/workflows/publish-current-model-production.yml
    with: { model: hrrr-ak, kind: regional }
    secrets:
      ATMOS_DEPLOY_KEY: ${{ secrets.ATMOS_DEPLOY_KEY }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
      CATALOG_ENDPOINT_PRODUCTION: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
      CATALOG_PROMOTION_KEY_PRODUCTION: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
  publish-nam:
    needs: regional-nam
    if: ${{ needs.regional-nam.result == 'success' && vars.CURRENT_RUN_COMPONENT_PUBLISH_ENABLED == 'true' }}
    uses: ./.github/workflows/publish-current-model-production.yml
    with: { model: nam, kind: regional }
    secrets:
      ATMOS_DEPLOY_KEY: ${{ secrets.ATMOS_DEPLOY_KEY }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
      CATALOG_ENDPOINT_PRODUCTION: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
      CATALOG_PROMOTION_KEY_PRODUCTION: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
  publish-nam-hi:
    needs: regional-nam-hi
    if: ${{ needs.regional-nam-hi.result == 'success' && vars.CURRENT_RUN_COMPONENT_PUBLISH_ENABLED == 'true' }}
    uses: ./.github/workflows/publish-current-model-production.yml
    with: { model: nam-hi, kind: regional }
    secrets:
      ATMOS_DEPLOY_KEY: ${{ secrets.ATMOS_DEPLOY_KEY }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
      CATALOG_ENDPOINT_PRODUCTION: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
      CATALOG_PROMOTION_KEY_PRODUCTION: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
  publish-nam-ak:
    needs: regional-nam-ak
    if: ${{ needs.regional-nam-ak.result == 'success' && vars.CURRENT_RUN_COMPONENT_PUBLISH_ENABLED == 'true' }}
    uses: ./.github/workflows/publish-current-model-production.yml
    with: { model: nam-ak, kind: regional }
    secrets:
      ATMOS_DEPLOY_KEY: ${{ secrets.ATMOS_DEPLOY_KEY }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
      CATALOG_ENDPOINT_PRODUCTION: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
      CATALOG_PROMOTION_KEY_PRODUCTION: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
  component-publish-status:
    needs: [publish-ecmwf, publish-gfs, publish-hrrr, publish-aifs, publish-icon, publish-hrdps, publish-arome-antilles, publish-hrrr-ak, publish-nam, publish-nam-hi, publish-nam-ak]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ECMWF: ${{ needs.publish-ecmwf.result == 'skipped' && 'withheld' || (needs.publish-ecmwf.outputs.status || 'failed') }}
      GFS: ${{ needs.publish-gfs.result == 'skipped' && 'withheld' || (needs.publish-gfs.outputs.status || 'failed') }}
      HRRR: ${{ needs.publish-hrrr.result == 'skipped' && 'withheld' || (needs.publish-hrrr.outputs.status || 'failed') }}
      AIFS: ${{ needs.publish-aifs.result == 'skipped' && 'withheld' || (needs.publish-aifs.outputs.status || 'failed') }}
      ICON: ${{ needs.publish-icon.result == 'skipped' && 'withheld' || (needs.publish-icon.outputs.status || 'failed') }}
      HRDPS: ${{ needs.publish-hrdps.result == 'skipped' && 'withheld' || (needs.publish-hrdps.outputs.status || 'failed') }}
      AROME_ANTILLES: ${{ needs.publish-arome-antilles.result == 'skipped' && 'withheld' || (needs.publish-arome-antilles.outputs.status || 'failed') }}
      HRRR_AK: ${{ needs.publish-hrrr-ak.result == 'skipped' && 'withheld' || (needs.publish-hrrr-ak.outputs.status || 'failed') }}
      NAM: ${{ needs.publish-nam.result == 'skipped' && 'withheld' || (needs.publish-nam.outputs.status || 'failed') }}
      NAM_HI: ${{ needs.publish-nam-hi.result == 'skipped' && 'withheld' || (needs.publish-nam-hi.outputs.status || 'failed') }}
      NAM_AK: ${{ needs.publish-nam-ak.result == 'skipped' && 'withheld' || (needs.publish-nam-ak.outputs.status || 'failed') }}
    steps:
      - name: report independent component publication outcomes
        run: |
          for row in "ecmwf:$ECMWF" "gfs:$GFS" "hrrr:$HRRR" "aifs:$AIFS" "icon:$ICON" "hrdps:$HRDPS" \
            "arome-antilles:$AROME_ANTILLES" "hrrr-ak:$HRRR_AK" "nam:$NAM" "nam-hi:$NAM_HI" "nam-ak:$NAM_AK"; do
            case "${row#*:}" in published|unchanged|withheld|failed) ;; *) exit 1 ;; esac
            echo "$row"
          done

  bake:
    # Collection is read-only and may overlap the previous cycle's processing. Keep the
    # exact legacy workflow lock here: old workflow owners and new publisher jobs serialize.
    # Pending jobs still use GitHub's single/latest-wins queue; running publishers never cancel.
    concurrency:
      group: weatherx-data-maintenance
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Join bounded collectors before assembling one release. Missing regional inputs abstain
    # in the roster; missing core inputs withhold this candidate. Only this job can publish.
    needs: [core-ecmwf, core-gfs, core-hrrr, core-aifs, regional-icon, regional-hrdps, regional-arome-antilles, regional-hrrr-ak, regional-nam, regional-nam-hi, regional-nam-ak]
    # Recovery provenance failures are not optional provider abstentions. A refused
    # regional recovery must withhold the entire candidate, never publish a subset.
    if: ${{ always() && !cancelled() && needs.core-ecmwf.result == 'success' && needs.core-gfs.result == 'success' && needs.core-hrrr.result == 'success' && needs.core-aifs.result == 'success' && (inputs.recovery_run_id == '' || (needs.regional-icon.result == 'success' && needs.regional-hrdps.result == 'success' && needs.regional-arome-antilles.result == 'success' && needs.regional-hrrr-ak.result == 'success' && needs.regional-nam.result == 'success' && needs.regional-nam-hi.result == 'success' && needs.regional-nam-ak.result == 'success')) }}
    steps:
      - name: checkout atmos (private, read-only deploy key)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          # Approved by full Atmos CI. The whole release produced below must pass
          # its own gates before any staging or production consumer can select it.
          ref: d8cd45d123f60c30c413c14d46f68113e37468b7
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          fetch-depth: 32 # bounded reviewed checkout history
          persist-credentials: false
      - name: Verify approved immutable collector before running source
        run: |
          test "$(git rev-parse HEAD)" = "d8cd45d123f60c30c413c14d46f68113e37468b7"
          git diff --exit-code HEAD
      - name: plan conservative no-change fast path
        id: bake_plan
        env:
          LIVE: https://atmos-platform-dnp.pages.dev
          PLAN: ${{ runner.temp }}/weatherx-bake-plan.json
        run: |
          # This guard is deliberately fail-open. A missing script during a staggered rollout,
          # a provider timeout, or an internal preflight error must run the normal full bake.
          if ! timeout 90s python3 ops/bake_no_change.py plan \
            --live "$LIVE" --output "$PLAN" --github-output "$GITHUB_OUTPUT"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=preflight-command-failed" >> "$GITHUB_OUTPUT"
            echo "preflight failed; continuing with the full bake"
          fi
          # This plan only compares core/live state. It cannot discard freshly collected
          # regional artifacts or certify all eleven models; the joined gates must run.
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "reason=distributed-model-inputs-require-qualification" >> "$GITHUB_OUTPUT"
      - name: preflight conditional data publication credentials
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        env:
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
        run: |
          test -n "$CATALOG_ENDPOINT" && test -n "$CATALOG_PROMOTION_KEY" || {
            echo "Production data CATALOG_ENDPOINT or CATALOG_PROMOTION_KEY is missing" >&2
            exit 1
          }
      - name: pinned ground verifier runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        with: { python-version: '3.11' }
      - name: ground verifier image dependency
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        run: python3.11 -m pip install pillow
      # Restore the data runtime after provisioning the separately pinned ground verifier.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: system eccodes and S3-compatible transfer client
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          archive="$RUNNER_TEMP/rclone-v1.75.0-linux-amd64.zip"
          curl --fail --silent --show-error --location \
            https://github.com/rclone/rclone/releases/download/v1.75.0/rclone-v1.75.0-linux-amd64.zip \
            --output "$archive"
          printf '%s  %s\n' 'aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa' "$archive" | sha256sum --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/rclone-v1.75.0-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1 | grep -Fx 'rclone v1.75.0'
      - name: venv + python deps
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        run: |
          python -m venv data/.venv
          data/.venv/bin/pip install -r data/requirements.txt
      # Verify the pristine approved checkout before hydration intentionally updates
      # tracked data-atmos fixtures. Inputs remain outside the checkout until the bake.
      - name: receive regional display packs from the family jobs
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        continue-on-error: ${{ inputs.recovery_run_id == '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: regional-packs-*
          path: ${{ runner.temp }}/regional-packs
          merge-multiple: true
      - name: receive sealed core model inputs from all four collectors
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-model-packs-*
          path: ${{ runner.temp }}/core-model-packs
          merge-multiple: true
      - name: checkout this reviewed recovery transfer checker
        if: ${{ inputs.recovery_run_id != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/v3t7kq-cycle
          ref: ${{ github.sha }}
          path: cycle-controller
          persist-credentials: false
      - name: verify every recovery transfer before assembly
        if: ${{ inputs.recovery_run_id != '' }}
        env:
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          test "$(git -C cycle-controller rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$RUNNER_TEMP/recovery-controller"
          mv cycle-controller "$RUNNER_TEMP/recovery-controller"
          data/.venv/bin/python "$RUNNER_TEMP/recovery-controller/tools/recover-model-inputs.py" \
            --verify-transfers --run-id "$RECOVERY_RUN_ID" \
            --current-source-sha "$(git rev-parse HEAD)" --atmos-root "$GITHUB_WORKSPACE" \
            --core-packs "$RUNNER_TEMP/core-model-packs" --regional-packs "$RUNNER_TEMP/regional-packs"
      # GitHub caches are repository-scoped. The one-off seed used to live in the private atmos
      # repo while this scheduled bake lives here, so every cycle started with an empty cache and
      # rebuilt a 0.75-day archive over the qualified history. Restore/save in THIS repository so
      # the scheduled writer and the seed share one persistence boundary.
      - name: restore rolling verification cache
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/.verify_cache
            data/.ens_points
            data/.ecmwf-float
            data/.gfs-float
            data/.aifs-float
          key: verify-cache-live-${{ github.run_id }}
          restore-keys: verify-cache-live-
      - name: Retry restored fusion-input vault before new downloads
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          VAULT_REMOTE: weatherx:weatherx-data-staging/vault
          VAULT_SKIP_LEDGER: '1'
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/vault-archive.sh
      - name: app deps (Weather Lab and release gates)
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        run: npm ci --prefix app
      - name: preflight temporary browser-test bundle before weather downloads
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        env:
          VITE_PRODUCT: lab
          VITE_APP: lab
          WX_GROUND_QUALIFICATION_SCOPE: staging-qualification-only
        run: |
          gate_build="$(mktemp -d "$RUNNER_TEMP/weatherx-gate-build.XXXXXX")"
          trap 'rm -rf "$gate_build"' EXIT
          cd app
          npx vite build --outDir "$gate_build/dist"
      # This lane always offers sealed distributed core inputs. The source deliberately
      # disables whole-checkpoint reuse in that mode; restoring its unused archive here
      # would dirty exact checkout admission. Retained model artifacts remain reusable.
      - name: playwright chromium (the demo-ready gate drives a real browser on deploy cycles)
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        run: cd app && npx playwright install --with-deps chromium
      - name: hydrate and verify current production R2 release
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        env:
          R2_REMOTE: weatherx:weatherx-data-production
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/platform/hydrate-r2-release.sh
      - name: bake → gate → publish immutable data release
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        env:
          WEATHERX_BAKE_LIVE_PROGRESS: '1'
          WEATHERX_LIVE_ORIGIN: https://weatherx.org
          REGIONAL_PACKS_DIR: ${{ runner.temp }}/regional-packs
          CORE_MODEL_PACKS_DIR: ${{ runner.temp }}/core-model-packs
          WEATHERX_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id || '' }}
          BAKE_PREFLIGHT_PLAN: ${{ runner.temp }}/weatherx-bake-plan.json
          DATA_PUBLISH_MODE: r2-release
          R2_REMOTE: weatherx:weatherx-data-production
          COMPONENT_R2_REMOTE: weatherx:weatherx-components-production
          RELEASE_ID: cycle-${{ github.run_id }}
          MAINTENANCE_MODEL_PARALLELISM: '2'
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/bake-weatherx.sh
      - name: save rolling verification cache
        if: ${{ always() && steps.bake_plan.outputs.skip != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/.verify_cache
            data/.ens_points
            data/.ecmwf-float
            data/.gfs-float
            data/.aifs-float
          key: verify-cache-live-${{ github.run_id }}
      # The bake script also archives on its healthy path. This independent retry is intentionally
      # `always()`: a release gate can fail after model/obs downloads, and those inputs are still
      # irreplaceable. The Actions cache above keeps them available if R2 itself is transiently down.
      - name: Archive irreplaceable fusion inputs even after a failed release gate
        if: ${{ always() && steps.bake_plan.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          VAULT_REMOTE: weatherx:weatherx-data-staging/vault
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/vault-archive.sh
      - name: Mirror the last-good whole release into staging R2
        if: ${{ success() && steps.bake_plan.outputs.skip != 'true' && vars.R2_FALLBACK_MIRROR_ENABLED == 'true' }}
        env:
          R2_REMOTE: weatherx:weatherx-data-staging
          RELEASE_ID: cycle-${{ github.run_id }}
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/platform/publish-r2-release.sh
      - name: no-change cycle summary
        if: ${{ steps.bake_plan.outputs.skip == 'true' }}
        env:
          REASON: ${{ steps.bake_plan.outputs.reason }}
        run: |
          echo "✓ recent exact duplicate; full bake safely skipped ($REASON)"
          cat "${{ runner.temp }}/weatherx-bake-plan.json"
      - name: cycle log
        if: always()
        run: |
          # A bake can cross UTC midnight. Keep bounded checkpoint/resource
          # receipts from the newest log even when browser output fills its tail.
          # Do not upload the full internal log or print unrelated earlier lines.
          log_file=
          for candidate in ops/logs/bake-*.log; do
            if [ -f "$candidate" ] && [ ! -L "$candidate" ] &&
               { [ -z "$log_file" ] || [ "$candidate" -nt "$log_file" ]; }; then
              log_file="$candidate"
            fi
          done
          if [ -n "$log_file" ] && [ -f "$log_file" ]; then
            awk '
              /^\[[0-9T:.+Z-]+\] bake-stage name=[a-zA-Z0-9-]+ event=start$/ { print; next }
              /^\[[0-9T:.+Z-]+\] bake-stage name=[a-zA-Z0-9-]+ event=end status=[0-9]+ elapsed_seconds=[0-9]+$/ { print; next }
              /^point-series worker model=(ecmwf|gfs|hrrr|aifs|icon|hrrr-ak|hrdps|nam|nam-hi|nam-ak|arome-antilles) status=(-?[0-9]+|start-failed) seconds=[0-9.]+$/ { print; next }
              /^\{"status": "installed-unqualified-inputs", "models": \["ecmwf", "gfs", "hrrr", "aifs"\], "runId": "[0-9]+", "sourceSha": "[a-f0-9]+", "requiresEnrichment": true\}$/ { print; next }
              /^promoted cycle-[0-9]+$/ { print; next }
              /^\[[0-9T:.+Z-]+\] === cycle complete ===$/ { print; next }
              /^checkpoint: / { print substr($0, 1, 512); next }
              /^model-input resource (ecmwf|gfs|hrrr|aifs|icon) peak-rss-kib=[0-9]+ elapsed-seconds=[0-9.]+$/ { print; next }
              /^\[[0-9T:.+Z-]+\] model-input start (ecmwf|gfs|hrrr|aifs|icon)$/ { print; next }
              /^\[[0-9T:.+Z-]+\] model-input end (ecmwf|gfs|hrrr|aifs|icon) exit=-?[0-9]+$/ { print; next }
              /^\[[0-9T:.+Z-]+\] regional-model install (icon|hrrr-ak|hrdps|nam|nam-hi|nam-ak|arome-antilles) status=(fresh|carried|absent)/ { print substr($0, 1, 512) }
            ' "$log_file" || true
            tail -n 200 "$log_file" || true
          fi
  # Reporting cannot publish, change admission, or turn an abstention into data.
  model-status:
    needs: [core-ecmwf, core-gfs, core-hrrr, core-aifs, regional-icon, regional-hrdps, regional-arome-antilles, regional-hrrr-ak, regional-nam, regional-nam-hi, regional-nam-ak, bake]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Explain all eleven outcomes without deployment authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/bake-model-status.mjs
      - name: Retain the small non-secret historical model report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weatherx-model-status/report.json
          retention-days: 14
          if-no-files-found: warn
