# Unattended legacy data-maintenance cycle. It owns observations/truth, accuracy, vault, and
# ancillary data, then publishes one immutable whole-data release to production R2. It has no
# Pages credential and cannot deploy or overwrite the application shell.
name: bake
permissions:
  contents: read
  actions: read
on:
  schedule:
    - cron: '30 2,8,14,20 * * *'   # ~20 min after each ECMWF publication lands
  workflow_dispatch:               # manual data refresh; UI releases use ui-release.yml
    inputs:
      recovery_run_id:
        description: Optional reviewed failed run whose unchanged model inputs may be recovered
        type: string
        required: false
        default: ''
concurrency:
  group: weatherx-data-maintenance
  cancel-in-progress: false        # never abort a half-written run
jobs:
  # Eleven isolated model collectors start together. Only the joined bake job can publish.
  # ECMWF and GFS each get a full runner instead of competing for shared memory.
  core:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model: [ecmwf, gfs, hrrr, aifs]
    env:
      CORE_MODEL: ${{ matrix.model }}
      PYTHONUNBUFFERED: '1'
      RECOVERY_RUN_ID: ${{ inputs.recovery_run_id || '' }}
    steps:
      - name: reject unsupported recovery before any collector work
        run: |
          test -z "$RECOVERY_RUN_ID" || {
            test "$GITHUB_EVENT_NAME" = workflow_dispatch && test "$GITHUB_REF" = refs/heads/main && test "$RECOVERY_RUN_ID" = 33925520386
          }
      - name: checkout atmos core collector (same approved commit, read-only deploy key)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: 3aea993c74f616e4428cbabbf216b4442734c9cf
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          fetch-depth: 32
          persist-credentials: false
      - name: Verify approved immutable core collector before running source
        run: |
          test "$(git rev-parse HEAD)" = "3aea993c74f616e4428cbabbf216b4442734c9cf"
          git diff --exit-code HEAD
      - name: checkout this reviewed recovery controller
        if: ${{ inputs.recovery_run_id != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/v3t7kq-cycle
          ref: ${{ github.sha }}
          path: cycle-controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: system eccodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
      - name: venv + python deps
        run: |
          python -m venv data/.venv
          data/.venv/bin/pip install -r data/requirements.txt
      - name: recover only compatible completed core inputs
        id: recovery
        if: ${{ inputs.recovery_run_id != '' }}
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C cycle-controller rev-parse HEAD)" = "$GITHUB_SHA"
          # Regional producer snapshots reject any untracked checkout inside Atmos.
          # Keep controller code outside the model producer root before admission or collection.
          test ! -e "$RUNNER_TEMP/recovery-controller"
          mv cycle-controller "$RUNNER_TEMP/recovery-controller"
          data/.venv/bin/python "$RUNNER_TEMP/recovery-controller/tools/recover-model-inputs.py" \
            --run-id "$RECOVERY_RUN_ID" --kind core --model "$CORE_MODEL" \
            --current-source-sha "$(git rev-parse HEAD)" --atmos-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/core-model-packs" --github-output "$GITHUB_OUTPUT"
      - name: collect one core model and seal its map, point and float inputs
        if: ${{ steps.recovery.outputs.reused != 'true' }}
        timeout-minutes: 60
        run: |
          data/.venv/bin/python data/bake_model_inputs.py --model "$CORE_MODEL"
          data/.venv/bin/python ops/core_model_artifact.py seal \
            --model "$CORE_MODEL" --source-sha "$(git rev-parse HEAD)" \
            --root "$GITHUB_WORKSPACE" --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/core-model-packs"
      - name: retain only sealed core model inputs for the joined bake
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-model-packs-${{ matrix.model }}
          path: ${{ runner.temp }}/core-model-packs
          compression-level: 1
          include-hidden-files: true # allowlisted float/point directories, never a workspace upload
          retention-days: 1
          if-no-files-found: error
  # Every regional model has an isolated runner; provider misses still yield explicit abstention.
  regional:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        model: [icon, hrdps, arome-antilles, hrrr-ak, nam, nam-hi, nam-ak]
    env:
      REGIONAL_MODEL: ${{ matrix.model }}
      PYTHONUNBUFFERED: '1'
      RECOVERY_RUN_ID: ${{ inputs.recovery_run_id || '' }}
    steps:
      - name: reject unsupported recovery before any collector work
        run: |
          test -z "$RECOVERY_RUN_ID" || {
            test "$GITHUB_EVENT_NAME" = workflow_dispatch && test "$GITHUB_REF" = refs/heads/main && test "$RECOVERY_RUN_ID" = 33925520386
          }
      - name: checkout atmos regional collector (same approved commit, read-only deploy key)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          # Must equal the bake job's approved commit: the bake refuses a pack collected elsewhere.
          ref: 3aea993c74f616e4428cbabbf216b4442734c9cf
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          fetch-depth: 32
          persist-credentials: false
      - name: Verify approved immutable regional collector before running source
        run: |
          test "$(git rev-parse HEAD)" = "3aea993c74f616e4428cbabbf216b4442734c9cf"
          git diff --exit-code HEAD
      - name: checkout this reviewed recovery controller
        if: ${{ inputs.recovery_run_id != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/v3t7kq-cycle
          ref: ${{ github.sha }}
          path: cycle-controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: system eccodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
      - name: venv + python deps
        run: |
          python -m venv data/.venv
          data/.venv/bin/pip install -r data/requirements.txt
      - name: recover only compatible completed regional inputs
        id: recovery
        if: ${{ inputs.recovery_run_id != '' }}
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C cycle-controller rev-parse HEAD)" = "$GITHUB_SHA"
          # Regional producer snapshots reject any untracked checkout inside Atmos.
          # Keep controller code outside the model producer root before admission or collection.
          test ! -e "$RUNNER_TEMP/recovery-controller"
          mv cycle-controller "$RUNNER_TEMP/recovery-controller"
          data/.venv/bin/python "$RUNNER_TEMP/recovery-controller/tools/recover-model-inputs.py" \
            --run-id "$RECOVERY_RUN_ID" --kind regional --model "$REGIONAL_MODEL" \
            --current-source-sha "$(git rev-parse HEAD)" --atmos-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/regional-packs" --github-output "$GITHUB_OUTPUT"
      - name: collect one regional model for the newest complete cycle (one older-cycle fallback)
        if: ${{ steps.recovery.outputs.reused != 'true' }}
        timeout-minutes: 45
        run: |
          df -h "$RUNNER_TEMP"
          case "$REGIONAL_MODEL" in
            icon|hrdps|arome-antilles|hrrr-ak|nam|nam-hi|nam-ak) ;;
            *) echo "unknown regional model: $REGIONAL_MODEL" >&2; exit 2 ;;
          esac
          data/.venv/bin/python data/bake_regional_models.py collect --model "$REGIONAL_MODEL" \
            --source-sha "$(git rev-parse HEAD)" --workers 2 --output "$RUNNER_TEMP/regional-packs"
      - name: hand the display packs (or abstention receipts) to the bake job
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regional-packs-${{ matrix.model }}
          path: ${{ runner.temp }}/regional-packs
          retention-days: 1
          if-no-files-found: warn
  bake:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Join bounded collectors before assembling one release. Missing regional inputs abstain
    # in the roster; missing core inputs withhold this candidate. Only this job can publish.
    needs: [core, regional]
    # Recovery provenance failures are not optional provider abstentions. A refused
    # regional recovery must withhold the entire candidate, never publish a subset.
    if: ${{ always() && !cancelled() && needs.core.result == 'success' && (inputs.recovery_run_id == '' || needs.regional.result == 'success') }}
    steps:
      - name: checkout atmos (private, read-only deploy key)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          # Approved by full Atmos CI. The whole release produced below must pass
          # its own gates before any staging or production consumer can select it.
          ref: 3aea993c74f616e4428cbabbf216b4442734c9cf
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          fetch-depth: 32 # bound checkout cost; unknown checkpoint ancestry is a cache miss
          persist-credentials: false
      - name: Verify approved immutable collector before running source
        run: |
          test "$(git rev-parse HEAD)" = "3aea993c74f616e4428cbabbf216b4442734c9cf"
          git diff --exit-code HEAD
      - name: plan conservative no-change fast path
        id: bake_plan
        env:
          LIVE: https://atmos-platform-dnp.pages.dev
          PLAN: ${{ runner.temp }}/weatherx-bake-plan.json
        run: |
          # This guard is deliberately fail-open. A missing script during a staggered rollout,
          # a provider timeout, or an internal preflight error must run the normal full bake.
          if ! timeout 90s python3 ops/bake_no_change.py plan \
            --live "$LIVE" --output "$PLAN" --github-output "$GITHUB_OUTPUT"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=preflight-command-failed" >> "$GITHUB_OUTPUT"
            echo "preflight failed; continuing with the full bake"
          fi
          # This plan only compares core/live state. It cannot discard freshly collected
          # regional artifacts or certify all eleven models; the joined gates must run.
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "reason=distributed-model-inputs-require-qualification" >> "$GITHUB_OUTPUT"
      - name: preflight conditional data publication credentials
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        env:
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
        run: |
          test -n "$CATALOG_ENDPOINT" && test -n "$CATALOG_PROMOTION_KEY" || {
            echo "Production data CATALOG_ENDPOINT or CATALOG_PROMOTION_KEY is missing" >&2
            exit 1
          }
      - name: pinned ground verifier runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        with: { python-version: '3.11' }
      - name: ground verifier image dependency
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        run: python3.11 -m pip install pillow
      # Restore the data runtime after provisioning the separately pinned ground verifier.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: system eccodes and S3-compatible transfer client
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          archive="$RUNNER_TEMP/rclone-v1.75.0-linux-amd64.zip"
          curl --fail --silent --show-error --location \
            https://github.com/rclone/rclone/releases/download/v1.75.0/rclone-v1.75.0-linux-amd64.zip \
            --output "$archive"
          printf '%s  %s\n' 'aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa' "$archive" | sha256sum --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/rclone-v1.75.0-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1 | grep -Fx 'rclone v1.75.0'
      - name: venv + python deps
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        run: |
          python -m venv data/.venv
          data/.venv/bin/pip install -r data/requirements.txt
      # GitHub caches are repository-scoped. The one-off seed used to live in the private atmos
      # repo while this scheduled bake lives here, so every cycle started with an empty cache and
      # rebuilt a 0.75-day archive over the qualified history. Restore/save in THIS repository so
      # the scheduled writer and the seed share one persistence boundary.
      - name: restore rolling verification cache
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/.verify_cache
            data/.ens_points
            data/.ecmwf-float
            data/.gfs-float
            data/.aifs-float
          key: verify-cache-live-${{ github.run_id }}
          restore-keys: verify-cache-live-
      - name: Retry restored fusion-input vault before new downloads
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          VAULT_REMOTE: weatherx:weatherx-data-staging/vault
          VAULT_SKIP_LEDGER: '1'
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/vault-archive.sh
      - name: app deps (Weather Lab and release gates)
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        run: npm ci --prefix app
      - name: preflight temporary browser-test bundle before weather downloads
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        env:
          VITE_PRODUCT: lab
          VITE_APP: lab
          WX_GROUND_QUALIFICATION_SCOPE: staging-qualification-only
        run: |
          gate_build="$(mktemp -d "$RUNNER_TEMP/weatherx-gate-build.XXXXXX")"
          trap 'rm -rf "$gate_build"' EXIT
          cd app
          npx vite build --outDir "$gate_build/dist"
      - name: identify committed maintenance input producer
        id: maintenance_checkpoint
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        run: |
          producer="$(python3 ops/maintenance_checkpoint.py fingerprint)"
          [[ "$producer" =~ ^[a-f0-9]{64}$ ]]
          echo "producer=$producer" >> "$GITHUB_OUTPUT"
      # These are unqualified weather-data inputs only, never app code, secrets,
      # private fusion issuance archives, or a cached release-gate decision.
      - name: restore unqualified maintenance checkpoint
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ops/.maintenance-checkpoint
          key: maintenance-inputs-v1-${{ steps.maintenance_checkpoint.outputs.producer }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: maintenance-inputs-v1-${{ steps.maintenance_checkpoint.outputs.producer }}-
      - name: playwright chromium (the demo-ready gate drives a real browser on deploy cycles)
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        run: cd app && npx playwright install --with-deps chromium
      - name: hydrate and verify current production R2 release
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        env:
          R2_REMOTE: weatherx:weatherx-data-production
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/platform/hydrate-r2-release.sh
      - name: receive regional display packs from the family jobs
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        continue-on-error: ${{ inputs.recovery_run_id == '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: regional-packs-*
          path: ${{ runner.temp }}/regional-packs
          merge-multiple: true
      - name: receive sealed core model inputs from all four collectors
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-model-packs-*
          path: ${{ runner.temp }}/core-model-packs
          merge-multiple: true
      - name: checkout this reviewed recovery transfer checker
        if: ${{ inputs.recovery_run_id != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/v3t7kq-cycle
          ref: ${{ github.sha }}
          path: cycle-controller
          persist-credentials: false
      - name: verify every recovery transfer before assembly
        if: ${{ inputs.recovery_run_id != '' }}
        env:
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          test "$(git -C cycle-controller rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$RUNNER_TEMP/recovery-controller"
          mv cycle-controller "$RUNNER_TEMP/recovery-controller"
          data/.venv/bin/python "$RUNNER_TEMP/recovery-controller/tools/recover-model-inputs.py" \
            --verify-transfers --run-id "$RECOVERY_RUN_ID" \
            --current-source-sha "$(git rev-parse HEAD)" --atmos-root "$GITHUB_WORKSPACE" \
            --core-packs "$RUNNER_TEMP/core-model-packs" --regional-packs "$RUNNER_TEMP/regional-packs"
      - name: bake → gate → publish immutable data release
        if: ${{ steps.bake_plan.outputs.skip != 'true' }}
        env:
          WEATHERX_LIVE_ORIGIN: https://weatherx.org
          REGIONAL_PACKS_DIR: ${{ runner.temp }}/regional-packs
          CORE_MODEL_PACKS_DIR: ${{ runner.temp }}/core-model-packs
          WEATHERX_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id || '' }}
          BAKE_PREFLIGHT_PLAN: ${{ runner.temp }}/weatherx-bake-plan.json
          DATA_PUBLISH_MODE: r2-release
          R2_REMOTE: weatherx:weatherx-data-production
          COMPONENT_R2_REMOTE: weatherx:weatherx-components-production
          RELEASE_ID: cycle-${{ github.run_id }}
          MAINTENANCE_CHECKPOINT_ENABLED: '1'
          MAINTENANCE_MODEL_PARALLELISM: '2'
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/bake-weatherx.sh
      - name: save unqualified maintenance checkpoint
        if: ${{ always() && steps.bake_plan.outputs.skip != 'true' && steps.maintenance_checkpoint.outputs.producer != '' && hashFiles('ops/.maintenance-checkpoint/manifest.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ops/.maintenance-checkpoint
          key: maintenance-inputs-v1-${{ steps.maintenance_checkpoint.outputs.producer }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: save rolling verification cache
        if: ${{ always() && steps.bake_plan.outputs.skip != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/.verify_cache
            data/.ens_points
            data/.ecmwf-float
            data/.gfs-float
            data/.aifs-float
          key: verify-cache-live-${{ github.run_id }}
      # The bake script also archives on its healthy path. This independent retry is intentionally
      # `always()`: a release gate can fail after model/obs downloads, and those inputs are still
      # irreplaceable. The Actions cache above keeps them available if R2 itself is transiently down.
      - name: Archive irreplaceable fusion inputs even after a failed release gate
        if: ${{ always() && steps.bake_plan.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          VAULT_REMOTE: weatherx:weatherx-data-staging/vault
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/vault-archive.sh
      - name: Mirror the last-good whole release into staging R2
        if: ${{ success() && steps.bake_plan.outputs.skip != 'true' && vars.R2_FALLBACK_MIRROR_ENABLED == 'true' }}
        env:
          R2_REMOTE: weatherx:weatherx-data-staging
          RELEASE_ID: cycle-${{ github.run_id }}
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/platform/publish-r2-release.sh
      - name: no-change cycle summary
        if: ${{ steps.bake_plan.outputs.skip == 'true' }}
        env:
          REASON: ${{ steps.bake_plan.outputs.reason }}
        run: |
          echo "✓ recent exact duplicate; full bake safely skipped ($REASON)"
          cat "${{ runner.temp }}/weatherx-bake-plan.json"
      - name: cycle log
        if: always()
        run: |
          # A bake can cross UTC midnight. Keep bounded checkpoint/resource
          # receipts from the newest log even when browser output fills its tail.
          # Do not upload the full internal log or print unrelated earlier lines.
          log_file=
          for candidate in ops/logs/bake-*.log; do
            if [ -f "$candidate" ] && [ ! -L "$candidate" ] &&
               { [ -z "$log_file" ] || [ "$candidate" -nt "$log_file" ]; }; then
              log_file="$candidate"
            fi
          done
          if [ -n "$log_file" ] && [ -f "$log_file" ]; then
            awk '
              /^checkpoint: / { print substr($0, 1, 512); next }
              /^model-input resource (ecmwf|gfs|hrrr|aifs|icon) peak-rss-kib=[0-9]+ elapsed-seconds=[0-9.]+$/ { print; next }
              /^\[[0-9T:.+Z-]+\] model-input start (ecmwf|gfs|hrrr|aifs|icon)$/ { print; next }
              /^\[[0-9T:.+Z-]+\] model-input end (ecmwf|gfs|hrrr|aifs|icon) exit=-?[0-9]+$/ { print; next }
              /^\[[0-9T:.+Z-]+\] regional-model install (icon|hrrr-ak|hrdps|nam|nam-hi|nam-ak|arome-antilles) status=(fresh|carried|absent)/ { print substr($0, 1, 512) }
            ' "$log_file" || true
            tail -n 200 "$log_file" || true
          fi
