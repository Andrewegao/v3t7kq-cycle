name: WeatherX component bake
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model published by the provider notifier
        type: choice
        required: true
        default: all
        options: [all, ecmwf, gfs, hrrr, aifs]
  schedule:
    - cron: '*/10 * * * *'
    - cron: '7 * * * *'
jobs:
  model:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CATALOG_SCHEDULER_ENABLED == 'true' }}
    concurrency:
      group: weatherx-component-${{ matrix.model }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.model != 'all' && format('["{0}"]', inputs.model) || github.event_name == 'workflow_dispatch' && '["ecmwf","gfs","hrrr","aifs"]' || github.event.schedule == '*/10 * * * *' && '["hrrr"]' || '["ecmwf","gfs","aifs"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout WeatherX
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Install decode dependencies
        working-directory: atmos
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          python -m venv data/.venv
          data/.venv/bin/pip install -r data/requirements.txt
      - name: Restore only this model's last-known-good component
        working-directory: atmos
        env:
          COMPONENT_ID: ${{ matrix.model }}
          ALLOW_EMPTY_CATALOG: '1'
          CATALOG_R2_BUCKET: weatherx-data-staging
          COMPONENT_R2_BUCKET: weatherx-components-staging
          CLOUDFLARE_ACCOUNT_ID: a89f9a1af485021fbc60a68b163c7c6e
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash ops/platform/hydrate-r2-component.sh
      - name: Bake, validate, upload, and CAS-promote one model
        working-directory: atmos
        env:
          MODEL: ${{ matrix.model }}
          PUBLISH: '1'
          DATA_PUBLISH_MODE: component-catalog
          LIVE: https://atmos-platform-dnp.pages.dev
          COMPONENT_R2_BUCKET: weatherx-components-staging
          CLOUDFLARE_ACCOUNT_ID: a89f9a1af485021fbc60a68b163c7c6e
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY }}
        run: bash ops/bake-model-component.sh
