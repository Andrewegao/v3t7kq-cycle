name: WeatherX component bake
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model published by the provider notifier
        type: choice
        required: true
        default: all
        options: [all, slow, ecmwf, gfs, hrrr, aifs]
      target:
        description: Isolated catalog and component bucket set to publish
        type: choice
        required: true
        default: staging
        options: [staging, production]
      bootstrap_missing:
        description: Seed missing production components from the verified immutable whole-release fallback
        type: boolean
        required: false
        default: false
  schedule:
    # GitHub may delay or drop schedules on busy round-number boundaries. Keep the
    # ten-minute provider poll cadence, but offset it to a quieter minute.
    - cron: '8-59/10 * * * *'
    - cron: '7 * * * *'
jobs:
  model:
    environment: production
    # Fail open: native schedules remain a publisher unless an operator explicitly
    # disables the fallback after the Cloudflare trigger set is verified live.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CATALOG_GITHUB_FALLBACK_DISABLED != 'true' }}
    concurrency:
      group: weatherx-component-${{ github.event_name == 'workflow_dispatch' && inputs.target || vars.CATALOG_DEFAULT_TARGET || 'staging' }}-${{ matrix.model }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.model == 'slow' && '["ecmwf","gfs","aifs"]' || github.event_name == 'workflow_dispatch' && inputs.model != 'all' && format('["{0}"]', inputs.model) || github.event_name == 'workflow_dispatch' && '["ecmwf","gfs","hrrr","aifs"]' || github.event.schedule == '8-59/10 * * * *' && '["hrrr"]' || '["ecmwf","gfs","aifs"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      CATALOG_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || vars.CATALOG_DEFAULT_TARGET || 'staging' }}
      ATMOS_SHA: 7a50f19714f22e04dc610a5aa33d311b7d1dc673
      MODEL: ${{ matrix.model }}
    steps:
      - name: qualify production source and select schema-1 point reuse before credentials
        id: point_reuse
        env:
          APPROVED_SHA: ${{ vars.CURRENT_RUN_COMPONENT_PUBLISH_ATMOS_SHA }}
          POINT_REUSE_MODEL: ${{ vars.CURRENT_RUN_POINT_REUSE_MODEL }}
        run: |
          test "$CATALOG_TARGET" = staging || test "$CATALOG_TARGET" = production
          enabled=0
          if [ "$CATALOG_TARGET" = production ]; then
            test "$GITHUB_REPOSITORY" = Andrewegao/v3t7kq-cycle
            test "$GITHUB_REF" = refs/heads/main
            case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch) ;; *) exit 2 ;; esac
            test "$APPROVED_SHA" = "$ATMOS_SHA"
            case "$POINT_REUSE_MODEL" in
              ''|all|ecmwf|gfs|hrrr|aifs|icon|hrdps|arome-antilles|hrrr-ak|nam|nam-hi|nam-ak) ;;
              *) echo 'invalid point reuse selection' >&2; exit 2 ;;
            esac
            if [ "$POINT_REUSE_MODEL" = all ] || [ "$POINT_REUSE_MODEL" = "$MODEL" ]; then enabled=1; fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - name: Checkout WeatherX
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          # Qualified fast-lane source, independent of experimental app master.
          ref: 7a50f19714f22e04dc610a5aa33d311b7d1dc673
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: atmos
          persist-credentials: false
      - name: Verify approved immutable component collector
        working-directory: atmos
        run: |
          test "$(git rev-parse HEAD)" = "7a50f19714f22e04dc610a5aa33d311b7d1dc673"
          git diff --exit-code HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Install decode dependencies
        working-directory: atmos
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          archive="$RUNNER_TEMP/rclone-v1.75.0-linux-amd64.zip"
          curl --fail --silent --show-error --location \
            https://github.com/rclone/rclone/releases/download/v1.75.0/rclone-v1.75.0-linux-amd64.zip \
            --output "$archive"
          printf '%s  %s\n' 'aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa' "$archive" | sha256sum --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/rclone-v1.75.0-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1 | grep -Fx 'rclone v1.75.0'
          python -m venv data/.venv
          data/.venv/bin/pip install -r data/requirements.txt
      - name: Reject an unknown publication target
        env:
          BOOTSTRAP_MISSING: ${{ inputs.bootstrap_missing || false }}
          REQUESTED_MODEL: ${{ inputs.model || '' }}
        run: |
          test "$CATALOG_TARGET" = staging || test "$CATALOG_TARGET" = production
          if [ "$BOOTSTRAP_MISSING" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$CATALOG_TARGET" = production
            test "$REQUESTED_MODEL" = all
          fi
      - name: Restore only this model's last-known-good staging component
        if: ${{ env.CATALOG_TARGET == 'staging' }}
        working-directory: atmos
        env:
          COMPONENT_ID: ${{ matrix.model }}
          ALLOW_EMPTY_CATALOG: '1'
          ALLOW_MISSING_COMPONENT: '1'
          HYDRATE_MISSING_FROM_RELEASE: '1'
          CATALOG_R2_REMOTE: weatherx:weatherx-data-staging
          COMPONENT_R2_REMOTE: weatherx:weatherx-components-staging
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/platform/hydrate-r2-component.sh
      - name: Restore only this model's last-known-good production component
        if: ${{ env.CATALOG_TARGET == 'production' }}
        working-directory: atmos
        env:
          COMPONENT_ID: ${{ matrix.model }}
          ALLOW_MISSING_COMPONENT: ${{ inputs.bootstrap_missing && '1' || '0' }}
          HYDRATE_MISSING_FROM_RELEASE: ${{ inputs.bootstrap_missing && '1' || '0' }}
          CATALOG_R2_REMOTE: weatherx:weatherx-data-production
          COMPONENT_R2_REMOTE: weatherx:weatherx-components-production
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
        run: bash ops/platform/hydrate-r2-component.sh
      - name: Bake, validate, upload, and CAS-promote one staging model
        if: ${{ env.CATALOG_TARGET == 'staging' }}
        working-directory: atmos
        env:
          MODEL: ${{ matrix.model }}
          PUBLISH: '1'
          DATA_PUBLISH_MODE: component-catalog
          LIVE: https://atmos-platform-dnp.pages.dev
          CATALOG_R2_REMOTE: weatherx:weatherx-data-staging
          COMPONENT_R2_REMOTE: weatherx:weatherx-components-staging
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY }}
        run: |
          set -euo pipefail
          # Hydration step env is not inherited. Check CAS re-read transport before collection.
          : "${CATALOG_R2_REMOTE:?CATALOG_R2_REMOTE required before collection}"
          : "${COMPONENT_R2_REMOTE:?COMPONENT_R2_REMOTE required before collection}"
          : "${RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID:?R2 access key required before collection}"
          : "${RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY:?R2 secret key required before collection}"
          : "${CATALOG_ENDPOINT:?CATALOG_ENDPOINT required before collection}"
          : "${CATALOG_PROMOTION_KEY:?CATALOG_PROMOTION_KEY required before collection}"
          bash ops/bake-model-component.sh
      - name: Bake, validate, upload, and CAS-promote one production model
        if: ${{ env.CATALOG_TARGET == 'production' }}
        working-directory: atmos
        env:
          MODEL: ${{ matrix.model }}
          PUBLISH: '1'
          DATA_PUBLISH_MODE: component-catalog
          REUSE_ACTIVE_POINT_COMPONENT: ${{ steps.point_reuse.outputs.enabled }}
          REUSE_ACTIVE_MAP_COMPONENT: '0'
          REUSE_ACTIVE_MAP_OBJECTS: '0'
          PACK_COMPONENT_OBJECTS: '0'
          POINT_COMPONENT_PUBLISH_METRICS_FILE: ${{ runner.temp }}/point-publication-cost.json
          LIVE: https://weatherx.org
          CATALOG_R2_REMOTE: weatherx:weatherx-data-production
          COMPONENT_R2_REMOTE: weatherx:weatherx-components-production
          RCLONE_CONFIG_WEATHERX_TYPE: s3
          RCLONE_CONFIG_WEATHERX_PROVIDER: Cloudflare
          RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
          RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_WEATHERX_ENDPOINT: https://a89f9a1af485021fbc60a68b163c7c6e.r2.cloudflarestorage.com
          RCLONE_CONFIG_WEATHERX_REGION: auto
          CATALOG_ENDPOINT: ${{ secrets.CATALOG_ENDPOINT_PRODUCTION }}
          CATALOG_PROMOTION_KEY: ${{ secrets.CATALOG_PROMOTION_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          # Hydration step env is not inherited. Check CAS re-read transport before collection.
          : "${CATALOG_R2_REMOTE:?CATALOG_R2_REMOTE required before collection}"
          : "${COMPONENT_R2_REMOTE:?COMPONENT_R2_REMOTE required before collection}"
          : "${RCLONE_CONFIG_WEATHERX_ACCESS_KEY_ID:?R2 access key required before collection}"
          : "${RCLONE_CONFIG_WEATHERX_SECRET_ACCESS_KEY:?R2 secret key required before collection}"
          : "${CATALOG_ENDPOINT:?CATALOG_ENDPOINT required before collection}"
          : "${CATALOG_PROMOTION_KEY:?CATALOG_PROMOTION_KEY required before collection}"
          bash ops/bake-model-component.sh
      - name: retain aggregate point costs only after successful production publication
        if: ${{ success() && env.CATALOG_TARGET == 'production' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: point-publication-cost-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/point-publication-cost.json
          if-no-files-found: ignore
          retention-days: 14
