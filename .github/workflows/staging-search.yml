# Search metadata only. No weather publication, production writes, UI or Worker deployment.
name: WeatherX staging search candidate
on:
  schedule:
    # Fallback only: the Cloudflare scheduler Worker dispatches the renewal at the same minutes.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Inspect pointer, prepare candidate, activate reviewed bytes, or revoke staging override
        required: true
        type: choice
        options: [inspect, prepare, activate, revoke, renew]
      source_release:
        description: Prepare only - immutable whole release containing the five metadata directories
        required: false
        type: string
      candidate_sha256:
        description: Activate only - reviewed candidate digest printed by preparation
        required: false
        type: string
      expected_pointer_sha256:
        description: Activate/revoke - reviewed current pointer digest, or absent
        required: false
        type: string
      caller:
        description: Leave empty. Set only by the Cloudflare scheduler Worker (renew only, scheduled path)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: weatherx-staging-search
  cancel-in-progress: false
jobs:
  # Cron fallback stand-aside (scheduler/README.md). Only a GitHub `schedule` run consults it: a
  # dispatched run skips this job and every job below runs exactly as before. Read-only (workflow
  # token with actions: read; no checkout, no secret) and fail-open: an unreadable run list, a
  # timeout or a failure of this job leaves the fallback running.
  fallback-gate:
    name: fallback gate
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Stand aside when the scheduler already ran this lane
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          # Six-hourly (Worker and fallback :17). 30 min under the shortest slot gap: this slot's dispatch counts, the previous one's never.
          WINDOW_MINUTES: '330'
          # No run-name: any dispatched run of this workflow counts.
          DISPATCH_TITLE: ''
        run: |
          # Fail-open: the fallback runs unless a matching dispatched run is found.
          run=true
          workflow="${GITHUB_WORKFLOW_REF%@*}"
          workflow="${workflow##*/}"
          if since="$(jq -nr --argjson minutes "$WINDOW_MINUTES" '(now - $minutes * 60) | strftime("%Y-%m-%dT%H:%M:%SZ")')" &&
            body="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f event=workflow_dispatch -f branch=main -f "created=>=$since" -f per_page=100 -f exclude_pull_requests=true)" &&
            found="$(jq -er --arg since "$since" --arg title "$DISPATCH_TITLE" --argjson self "$GITHUB_RUN_ID" '
              .workflow_runs | if type == "array" then . else error("no run list") end
              | map(select(.id != $self and .event == "workflow_dispatch" and .head_branch == "main"
                  and (.created_at | type) == "string" and .created_at >= $since
                  and ($title == "" or .display_title == $title)
                  and (.conclusion == "success" or (.status | IN("queued", "in_progress", "waiting", "pending", "requested")))))
              | first | if . == null then "none" else "\(.id) \(.status) \(.conclusion // "-") \(.created_at)" end' <<<"$body")"; then
            if [ "$found" != none ]; then run=false; fi
          else
            found=unreadable
            echo "::warning::Could not read this workflow's dispatched runs; the fallback runs."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo "::notice::Stood aside: dispatched run ${found%% *} already covers this slot (last $WINDOW_MINUTES min)."
            echo "Fallback schedule stood aside: dispatched run ${found%% *} (${found#* }) is inside the last $WINDOW_MINUTES min." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Fallback schedule runs: no successful or active dispatched run in the last $WINDOW_MINUTES min ($found)." >> "$GITHUB_STEP_SUMMARY"
          fi
  search:
    # The Cloudflare scheduler Worker dispatches the renewal at the cron minute with caller=scheduler;
    # it takes the scheduled path and obeys the same STAGING_SEARCH_SCHEDULE_ENABLED switch.
    needs: fallback-gate
    if: ((github.event_name == 'workflow_dispatch' && inputs.caller != 'scheduler') || ((github.event_name == 'schedule' || (inputs.caller == 'scheduler' && inputs.action == 'renew')) && vars.STAGING_SEARCH_SCHEDULE_ENABLED == 'true')) && !cancelled() && needs.fallback-gate.outputs.run != 'false'
    environment:
      name: data-staging
      url: https://staging.weatherx.org
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEARCH_ACTION: ${{ (github.event_name == 'schedule' || inputs.caller == 'scheduler') && 'renew' || inputs.action }}
      SOURCE_RELEASE: ${{ inputs.source_release }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      EXPECTED_POINTER_SHA256: ${{ inputs.expected_pointer_sha256 }}
      STAGING_SEARCH_ENABLED: ${{ vars.STAGING_SEARCH_ENABLED }}
      STAGING_SEARCH_RENEWAL_ENABLED: ${{ vars.STAGING_SEARCH_RENEWAL_ENABLED }}
      STAGING_SEARCH_APPROVED_CANDIDATE_SHA256: ${{ vars.STAGING_SEARCH_APPROVED_CANDIDATE_SHA256 }}
      STAGING_SEARCH_V4_APPROVED_UI_SOURCE_SHA: ${{ vars.STAGING_SEARCH_V4_APPROVED_UI_SOURCE_SHA }}
      STAGING_SEARCH_V4_APPROVED_RELEASE_ID: ${{ vars.STAGING_SEARCH_V4_APPROVED_RELEASE_ID }}
      STAGING_DATA_ISOLATION_APPROVED: ${{ vars.STAGING_DATA_ISOLATION_APPROVED }}
      STAGING_R2_ACCOUNT_ID: ${{ vars.STAGING_R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Refuse unreviewed or non-main execution before using credentials
        run: node cycle/tools/staging-search.mjs gate
      - name: Install integrity-locked S3 client without credentials
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix cycle/staging-controller
      - name: Verify search publication and transport contracts without credentials
        run: node --test cycle/tests/staging-search.mjs cycle/tests/staging-search-s3.mjs cycle/tests/staging-search-build.mjs
      - name: Checkout the fixed producer or exact reviewed UI source
        if: inputs.action == 'prepare' || inputs.action == 'activate'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          fetch-depth: 0
          ref: ${{ inputs.action == 'prepare' && 'dfa25e9f473f15d5e2f630fe78c268b73234bd3a' || vars.STAGING_SEARCH_V4_APPROVED_UI_SOURCE_SHA }}
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: control
          persist-credentials: false
      - name: Verify the exact reviewed Search V4 reader source
        if: inputs.action == 'activate'
        run: node cycle/tools/staging-search.mjs source-compatibility
      - name: Build both indexes from one immutable published directory snapshot
        if: inputs.action == 'prepare'
        run: node cycle/tools/staging-search-build.mjs
      - name: Verify the reviewed V4 shell is the canonical staging release
        if: inputs.action == 'activate'
        run: node cycle/tools/staging-search.mjs compatibility
      - name: Write staging search objects or pointer only (conditional writes, verified readback)
        env:
          STAGING_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_WRITE_ACCESS_KEY_ID }}
          STAGING_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_WRITE_SECRET_ACCESS_KEY }}
        run: node cycle/tools/staging-search.mjs
