# Search metadata only. No weather publication, production writes, UI or Worker deployment.
name: WeatherX staging search candidate
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Inspect pointer, prepare candidate, activate reviewed bytes, or revoke staging override
        required: true
        type: choice
        options: [inspect, prepare, activate, revoke, renew]
      source_release:
        description: Prepare only - immutable whole release containing the five metadata directories
        required: false
        type: string
      candidate_sha256:
        description: Activate only - reviewed candidate digest printed by preparation
        required: false
        type: string
      expected_pointer_sha256:
        description: Activate/revoke - reviewed current pointer digest, or absent
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: weatherx-staging-search
  cancel-in-progress: false
jobs:
  search:
    if: github.event_name != 'schedule' || vars.STAGING_SEARCH_SCHEDULE_ENABLED == 'true'
    environment:
      name: data-staging
      url: https://staging.weatherx.org
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEARCH_ACTION: ${{ github.event_name == 'schedule' && 'renew' || inputs.action }}
      SOURCE_RELEASE: ${{ inputs.source_release }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      EXPECTED_POINTER_SHA256: ${{ inputs.expected_pointer_sha256 }}
      STAGING_SEARCH_ENABLED: ${{ vars.STAGING_SEARCH_ENABLED }}
      STAGING_SEARCH_RENEWAL_ENABLED: ${{ vars.STAGING_SEARCH_RENEWAL_ENABLED }}
      STAGING_SEARCH_APPROVED_CANDIDATE_SHA256: ${{ vars.STAGING_SEARCH_APPROVED_CANDIDATE_SHA256 }}
      STAGING_SEARCH_V4_APPROVED_SOURCE_SHA: ${{ vars.STAGING_SEARCH_V4_APPROVED_SOURCE_SHA }}
      STAGING_SEARCH_V4_APPROVED_RELEASE_ID: ${{ vars.STAGING_SEARCH_V4_APPROVED_RELEASE_ID }}
      STAGING_DATA_ISOLATION_APPROVED: ${{ vars.STAGING_DATA_ISOLATION_APPROVED }}
      STAGING_R2_ACCOUNT_ID: ${{ vars.STAGING_R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Refuse unreviewed or non-main execution before using credentials
        run: node cycle/tools/staging-search.mjs gate
      - name: Install integrity-locked S3 client without credentials
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix cycle/staging-controller
      - name: Verify search publication and transport contracts without credentials
        run: node --test cycle/tests/staging-search.mjs cycle/tests/staging-search-s3.mjs cycle/tests/staging-search-build.mjs
      - name: Checkout the reviewed metadata-only producer
        if: inputs.action == 'prepare'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: dfa25e9f473f15d5e2f630fe78c268b73234bd3a
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          path: control
          persist-credentials: false
      - name: Build both indexes from one immutable published directory snapshot
        if: inputs.action == 'prepare'
        run: node cycle/tools/staging-search-build.mjs
      - name: Verify the reviewed V4 shell is the canonical staging release
        if: inputs.action == 'activate'
        run: node cycle/tools/staging-search.mjs compatibility
      - name: Write staging search objects or pointer only (conditional writes, verified readback)
        env:
          STAGING_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_WRITE_ACCESS_KEY_ID }}
          STAGING_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_WRITE_SECRET_ACCESS_KEY }}
        run: node cycle/tools/staging-search.mjs
