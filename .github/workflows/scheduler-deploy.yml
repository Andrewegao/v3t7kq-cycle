name: WeatherX scheduler deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-bake.yml"
      - ".github/workflows/scheduler-deploy.yml"
      - "scheduler/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weatherx-model-scheduler-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scheduler/package-lock.json
      - name: Install locked scheduler dependencies
        working-directory: scheduler
        run: npm ci
      - name: Run scheduler release gates
        working-directory: scheduler
        run: npm run check
      - name: Require Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy Worker code and cron triggers
        working-directory: scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: npx wrangler deploy
      - name: Require exact live cron trigger set
        working-directory: scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: npm run verify:live
