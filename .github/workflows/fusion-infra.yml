name: WeatherX fusion infrastructure
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        default: staging
        required: true
      component:
        description: Deploy only the append-only archive, or the complete isolated pair
        type: choice
        options: [archive, all]
        default: archive
        required: true
      confirmation:
        description: Enter the exact deployment phrase required by the validation step
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: weatherx-fusion-infrastructure-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENGINE_SHA: ${{ vars.FUSION_ENGINE_SHA }}
      FUSION_INFRA_COMPONENT: ${{ inputs.component }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: ${{ env.ENGINE_SHA }}
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          persist-credentials: false
      - name: Require the reviewed immutable engine
        run: |
          [[ "$ENGINE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ENGINE_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Set up platform contract Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Install pinned platform contract dependencies
        timeout-minutes: 2
        # These match the reviewed Atmos data requirements used by the platform check.
        run: python -m pip install --disable-pip-version-check Pillow==12.2.0 numpy==2.4.6 eccodes==2.47.0
      - run: npm ci --prefix app
      - name: Feedback contract tests and CLI types
        run: |
          app/node_modules/.bin/tsx --test ops/fusion/test-signed-origin.ts ops/fusion/test-collection-provenance.ts
          app/node_modules/.bin/tsc -p ops/fusion/tsconfig.json --noEmit
      - name: Validate the exact deployment scope
        env:
          TARGET: ${{ inputs.target }}
          COMPONENT: ${{ inputs.component }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          case "$TARGET:$COMPONENT" in
            staging:archive) test "$CONFIRMATION" = 'DEPLOY FUSION ARCHIVE STAGING' ;;
            production:archive) test "$CONFIRMATION" = 'DEPLOY FUSION ARCHIVE PRODUCTION' ;;
            staging:all) test "$CONFIRMATION" = 'DEPLOY ISOLATED FUSION STAGING' ;;
            production:all) test "$CONFIRMATION" = 'DEPLOY ISOLATED FUSION PRODUCTION' ;;
            *) exit 1 ;;
          esac
      - run: npm ci --prefix platform/edge
      - run: npm run check --prefix platform/edge
      - name: Provision scoped keys only for an explicitly requested complete pair
        if: ${{ inputs.component == 'all' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FUSION_DEPLOY_API_TOKEN }}
          TARGET: ${{ inputs.target }}
          FUSION_ISSUANCE_KEY: ${{ secrets.FUSION_ISSUANCE_KEY }}
          FUSION_ARCHIVE_READ_KEY: ${{ secrets.FUSION_ARCHIVE_READ_KEY }}
          FUSION_PROMOTION_KEY: ${{ secrets.FUSION_PROMOTION_KEY }}
        run: node ops/fusion/provision.mjs
      - name: Deploy the isolated archive
        working-directory: platform/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FUSION_DEPLOY_API_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: npx wrangler deploy --env "$TARGET" -c wrangler.fusion-archive.jsonc
      - name: Deploy the controller only for an explicitly requested complete pair
        if: ${{ inputs.component == 'all' }}
        working-directory: platform/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FUSION_DEPLOY_API_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: npx wrangler deploy --env "$TARGET" -c wrangler.fusion-control.jsonc
      - name: Verify the production archive with read-only authority
        if: ${{ inputs.component == 'archive' && inputs.target == 'production' }}
        env:
          TARGET: ${{ inputs.target }}
          FUSION_ARCHIVE_READ_KEY: ${{ secrets.FUSION_ARCHIVE_READ_KEY }}
        run: app/node_modules/.bin/tsx ops/fusion/smoke.ts
      - name: Verify the staging archive with discovery and read-only authority
        if: ${{ inputs.component == 'archive' && inputs.target == 'staging' }}
        env:
          TARGET: ${{ inputs.target }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.FUSION_DEPLOY_API_TOKEN }}
          FUSION_ARCHIVE_READ_KEY: ${{ secrets.FUSION_ARCHIVE_READ_KEY }}
        run: app/node_modules/.bin/tsx ops/fusion/smoke.ts
      - name: Verify the complete isolated pair
        if: ${{ inputs.component == 'all' }}
        env:
          TARGET: ${{ inputs.target }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.FUSION_DEPLOY_API_TOKEN }}
          FUSION_ISSUANCE_KEY: ${{ secrets.FUSION_ISSUANCE_KEY }}
          FUSION_ARCHIVE_READ_KEY: ${{ secrets.FUSION_ARCHIVE_READ_KEY }}
          FUSION_PROMOTION_KEY: ${{ secrets.FUSION_PROMOTION_KEY }}
        run: app/node_modules/.bin/tsx ops/fusion/smoke.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fusion-infrastructure-proof-${{ inputs.target }}-${{ inputs.component }}
          path: feedback-output/infrastructure-proof.json
          if-no-files-found: error
          retention-days: 90
