# Exact-artifact promotion. Never builds Atmos. Entry points: manual dispatch, or (owner
# decision C) the successful completion of a staging qualification run while the owner has
# armed automatic promotion. When armed, an Atmos master push -> staging qualification ->
# a production promotion pending ui-production approval is the intended flow. Both paths
# pass the same activation/freeze gate, the protected ui-production environment, the
# exact-attempt artifact audit and the release guard's rollback + fuse.
name: WeatherX UI production promotion
# Shown to the ui-production approver: what source and profile this run would promote.
run-name: "${{ github.event_name != 'workflow_run' && format('Promote Staging {0} as {1} (manual, staging run {2})', inputs.atmos_sha, inputs.release_profile, inputs.staging_run_id) || github.event.workflow_run.conclusion != 'success' && format('Promote {0}: staging did not succeed, skipped', github.event.workflow_run.display_title) || vars.UI_AUTO_PROMOTE_ENABLED != 'true' && format('Promote {0}: not armed, skipped', github.event.workflow_run.display_title) || vars.UI_AUTO_PROMOTE_PROFILE == '' && format('Promote {0}: armed without a profile, refused', github.event.workflow_run.display_title) || format('Promote {0} as {1} (auto, staging run {2} attempt {3})', github.event.workflow_run.display_title, vars.UI_AUTO_PROMOTE_PROFILE, github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}"
on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful manual UI staging run ID
        required: true
        type: string
      atmos_sha:
        description: Exact source SHA shown in that staging run's summary
        required: true
        type: string
      candidate_digest:
        description: Exact 64-character artifact digest shown in that staging run's summary
        required: true
        type: string
      release_profile:
        description: Exact protected candidate profile to promote
        required: true
        default: none
        type: choice
        options:
          - none
          - production-account-billing-v1
          - production-account-ru-kk-beta-v1
          - production-account-ru-kk-wind100-onboarding-v2
  workflow_run:
    # Matched by name; resolve re-checks the run's workflow path, event, branch and attempt.
    workflows: [WeatherX UI staging qualification]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  issues: write # existing guarded rollback fuse, never automatic approval
jobs:
  resolve:
    # Automatic path only. Routes the exact staging run attempt that just succeeded; it has
    # no environment, no Pages or candidate key, and its outputs are re-audited by promote.
    if: ${{ github.event_name == 'workflow_run' && github.ref == 'refs/heads/main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && vars.UI_AUTO_PROMOTE_ENABLED == 'true' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      promote: ${{ steps.route.outputs.promote }}
      staging_run_id: ${{ steps.route.outputs.staging_run_id }}
      staging_run_attempt: ${{ steps.route.outputs.staging_run_attempt }}
      atmos_sha: ${{ steps.route.outputs.atmos_sha }}
      candidate_digest: ${{ steps.route.outputs.candidate_digest }}
      release_profile: ${{ steps.route.outputs.release_profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: route only the exact successful staging attempt and its armed profile
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ github.event.workflow_run.id }}
          STAGING_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UI_AUTO_PROMOTE_ENABLED: ${{ vars.UI_AUTO_PROMOTE_ENABLED }}
          UI_AUTO_PROMOTE_PROFILE: ${{ vars.UI_AUTO_PROMOTE_PROFILE }}
        run: node cycle/tools/ui-release.mjs resolve-auto
  promote:
    needs: resolve
    # Manual dispatch as before; automatic only after resolve admitted this exact attempt.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && needs.resolve.result == 'success' && needs.resolve.outputs.promote == 'true')) }}
    # Job-level, so a skipped automatic run never displaces a pending manual promotion.
    concurrency:
      group: weatherx-ui-production
      cancel-in-progress: false
    environment:
      name: ui-production
      url: https://weatherx.org
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UI_RELEASES_ENABLED: ${{ vars.UI_RELEASES_ENABLED }}
      UI_ISOLATION_APPROVED: ${{ vars.UI_ISOLATION_APPROVED }}
      UI_DEPLOYMENT_HOLD_UNTIL: ${{ vars.UI_DEPLOYMENT_HOLD_UNTIL }}
      UI_AUTO_PROMOTE_ENABLED: ${{ vars.UI_AUTO_PROMOTE_ENABLED }}
      UI_AUTO_PROMOTE_PROFILE: ${{ vars.UI_AUTO_PROMOTE_PROFILE }}
      ATMOS_SHA: ${{ github.event_name == 'workflow_run' && needs.resolve.outputs.atmos_sha || inputs.atmos_sha }}
      STAGING_RUN_ID: ${{ github.event_name == 'workflow_run' && needs.resolve.outputs.staging_run_id || inputs.staging_run_id }}
      STAGING_RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && needs.resolve.outputs.staging_run_attempt || '' }}
      CANDIDATE_DIGEST: ${{ github.event_name == 'workflow_run' && needs.resolve.outputs.candidate_digest || inputs.candidate_digest }}
      MODEL_SELECTION_SHA256: ${{ github.event_name == 'workflow_run' && needs.resolve.outputs.release_profile || inputs.release_profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: cycle, fetch-depth: 0, persist-credentials: false }
      - name: checkout reviewed release controller (not candidate source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weatherx-hq/atmos
          ref: ${{ env.MODEL_SELECTION_SHA256 == 'production-account-ru-kk-wind100-onboarding-v2' && 'b5a3088d001d6947790f123f5e0248c4aa0768bc' || env.MODEL_SELECTION_SHA256 == 'production-account-ru-kk-beta-v1' && 'b9db38dd22eed1da56c6c4dd4140480da7e89153' || env.MODEL_SELECTION_SHA256 == 'production-account-billing-v1' && '6fcec22638f6696be71daa2f2e974ebc4b24318e' || '25c402db5149daa018e349a34a4beeba1f2dca45' }}
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
          persist-credentials: false
          path: control
          # Keep the pinned release helpers, probes and their local assets; omit archived
          # design screenshots. Cycle's separate full-history ancestry checkout stays intact.
          sparse-checkout: |
            app
            ops
            platform
            data
            tools
            testing
            scripts
            docs/admin
            docs/engineering
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: enforce manual activation and freeze after environment approval
        run: node cycle/tools/ui-release.mjs gate
      # No cache crosses into this production publisher. The two locked installs are
      # independent, so the Functions toolchain installs concurrently with the app/browser.
      - name: install locked controller and verification tools (no application build)
        run: |
          npm ci --prefix control/platform/edge >"$RUNNER_TEMP/npm-ci-edge.log" 2>&1 &
          edge=$!
          npm ci --prefix control/app
          (cd control/app && npx playwright install --with-deps chromium)
          if ! wait "$edge"; then cat "$RUNNER_TEMP/npm-ci-edge.log"; exit 1; fi
          cat "$RUNNER_TEMP/npm-ci-edge.log"
      - name: download and authenticate exact successful staging artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UI_CANDIDATE_KEY: ${{ secrets.UI_CANDIDATE_KEY }}
        run: node cycle/tools/ui-release.mjs download
      - name: guarded exact-artifact promotion and three production probes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.UI_PRODUCTION_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a89f9a1af485021fbc60a68b163c7c6e
          UI_PAGES_CONFIG_SHA256: ${{ vars.UI_PAGES_CONFIG_SHA256 }}
        run: node cycle/tools/ui-release.mjs deploy production
      - name: retain automatic rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-production-incidents-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ui-incidents/*.json
            ${{ runner.temp }}/ui-deploy-transactions/production.json
            ${{ runner.temp }}/ui-deploy-transactions/production-guard-success.json
            ${{ runner.temp }}/ui-public-release-journeys/production.json
          if-no-files-found: ignore
          retention-days: 90
