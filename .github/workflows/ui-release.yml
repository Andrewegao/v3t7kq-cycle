# Short, independent WeatherX application-shell release. Data routes are served by the production
# R2 edge, so this workflow never downloads, bakes, uploads, or bundles forecast/ledger data.
name: WeatherX UI release
permissions:
  contents: read
  actions: read
  issues: write # automatic rollback opens the persistent release-fuse incident
on:
  workflow_dispatch:
    inputs:
      atmos_sha:
        description: Exact 40-character Atmos master commit to release
        required: true
        type: string
concurrency:
  group: weatherx-ui-production
  cancel-in-progress: false
jobs:
  release:
    environment:
      name: production
      url: https://weatherx.org
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout exact Atmos commit (private, read-only deploy key)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Andrewegao/atmos
          ref: ${{ inputs.atmos_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.ATMOS_DEPLOY_KEY }}
      - name: verify immutable Atmos source provenance
        env:
          ATMOS_SHA: ${{ inputs.atmos_sha }}
        run: |
          [[ "$ATMOS_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ATMOS_SHA"
          git fetch --no-tags origin master
          test "$ATMOS_SHA" = "$(git rev-parse origin/master)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: install application dependencies
        run: npm ci --prefix app
      - name: install Weather Lab browser
        run: cd app && npx playwright install --with-deps chromium
      - name: verify independent release architecture
        run: |
          node ops/platform/test-independent-ui-release.mjs
          node ops/release/test-production-verifiers.mjs
      - name: full application test gate
        run: npm test --prefix app
      - name: Weather Lab release gate
        env:
          LIVE_DATA: '1'
        run: bash ops/weather-lab-ready.sh
      - name: guarded UI-only production deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a89f9a1af485021fbc60a68b163c7c6e
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_GUARD_FUSE_MODE: github
          RELEASE_GUARD_INCIDENT_DIR: ${{ runner.temp }}/weatherx-release-guard/incidents
          RELEASE_GUARD_EXPECTED_GIT_SHA: ${{ inputs.atmos_sha }}
          RELEASE_GUARD_VERIFY_REQUIRED_SUCCESSES: '3'
          RELEASE_GUARD_VERIFY_SLEEP_SECONDS: '15'
          EDGE_ORIGIN: https://weatherx.org
          PLATFORM_EDGE_CONFIRMED: '1'
        run: bash ops/platform/deploy-code-only.sh
      - name: retain automatic rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weatherx-release-guard/incidents/*.json
          if-no-files-found: ignore
          retention-days: 90
